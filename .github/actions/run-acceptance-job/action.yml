name: Run Acceptance Job
description: Execute a Cloud Run Job with diagnostics wrapper

inputs:
  job_name:
    description: Cloud Run Job name
    required: true
  module:
    description: Python module to run (e.g. scripts.run_xxx_acceptance)
    required: true
  project_id:
    description: GCP project ID
    required: true
  region:
    description: GCP region
    required: true
  timeout:
    description: Task timeout
    required: false
    default: '10m'
  continue_on_error:
    description: Whether to continue on error
    required: false
    default: 'false'

outputs:
  outcome:
    description: Job execution outcome (success/failure)
    value: ${{ steps.run.outcome }}

runs:
  using: composite
  steps:
    - name: Run ${{ inputs.module }}
      id: run
      shell: bash
      continue-on-error: ${{ inputs.continue_on_error == 'true' }}
      run: |
        .github/scripts/run_cloud_run_job_with_diagnostics.sh "${{ inputs.job_name }}" \
          gcloud run jobs execute "${{ inputs.job_name }}" \
          --project "${{ inputs.project_id }}" \
          --region "${{ inputs.region }}" \
          --args=-m,${{ inputs.module }} \
          --task-timeout ${{ inputs.timeout }} \
          --wait \
          --quiet
