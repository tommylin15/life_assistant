name: Setup Playwright
description: Install Playwright and Chromium for UI acceptance testing

inputs:
  playwright_version:
    description: Playwright version
    required: false
    default: '1.55.0'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install Playwright
      shell: bash
      run: |
        npm install --no-save playwright@${{ inputs.playwright_version }}
        npx playwright install chromium
