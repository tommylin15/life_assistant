name: Reusable Cloud Run Acceptance

on:
  workflow_call:
    inputs:
      modules:
        description: JSON array of modules to run (e.g. ["scripts.run_xxx", "scripts.run_yyy"])
        required: true
        type: string
      job_name:
        description: Cloud Run Job name
        required: false
        type: string
        default: 'life-assistant-core-acceptance'
      timeout:
        description: Task timeout per module
        required: false
        type: string
        default: '10m'
      image_ref:
        description: Docker image reference (if job needs update)
        required: false
        type: string
        default: ''
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_DEPLOY_SERVICE_ACCOUNT:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: dev-test
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(inputs.modules) }}
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Update job image
        if: inputs.image_ref != ''
        run: |
          gcloud run jobs update "${{ inputs.job_name }}" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${{ inputs.image_ref }}" \
            --quiet

      - uses: ./.github/actions/run-acceptance-job
        with:
          job_name: ${{ inputs.job_name }}
          module: ${{ matrix.module }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          timeout: ${{ inputs.timeout }}
