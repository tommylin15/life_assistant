name: Reusable UI Acceptance

on:
  workflow_call:
    inputs:
      script_name:
        description: Playwright script filename (e.g. verify_calendar_ui_production.mjs)
        required: true
        type: string
      feature_name:
        description: Feature name for logging (e.g. calendar, habits)
        required: true
        type: string
      extra_scripts:
        description: Additional scripts to validate (space-separated)
        required: false
        type: string
        default: ''
      pre_check_script:
        description: Optional script to run before main acceptance
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-playwright

      - name: Validate acceptance scripts
        run: |
          node --check .github/scripts/${{ inputs.script_name }}
          for script in ${{ inputs.extra_scripts }}; do
            node --check ".github/scripts/$script"
          done

      - name: Run pre-check
        if: inputs.pre_check_script != ''
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          ${{ inputs.pre_check_script }}

      - name: Verify release and run ${{ inputs.feature_name }} UI acceptance
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          REMOTE_RELEASE="$(curl --fail --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "$BASE_URL/release.txt?${{ inputs.feature_name }}_acceptance=$RELEASE_SHA")"
          test "$REMOTE_RELEASE" = "$RELEASE_SHA"
          BASE_URL="$BASE_URL" node .github/scripts/${{ inputs.script_name }}

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.feature_name }}-ui-acceptance-${{ github.sha }}
          path: /tmp/${{ inputs.feature_name }}-ui-acceptance.png
          if-no-files-found: ignore
