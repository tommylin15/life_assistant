name: Calendar Existing Release UI Probe

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: "Existing Firebase release SHA to probe"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      EXPECTED_SHA: ${{ inputs.expected_release_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright

      - name: Validate and probe
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          
          LIVE="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/release.txt")"
          test "$LIVE" = "$EXPECTED_SHA"
          
          node --check .github/scripts/verify_calendar_ui_production.mjs
          BASE_URL="$BASE_URL" node .github/scripts/verify_calendar_ui_production.mjs

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-probe-${{ github.sha }}
          path: /tmp/calendar-ui-acceptance.png
          if-no-files-found: ignore
