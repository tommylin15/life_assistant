# Calendar #8 one-time release follow-up; only the explicitly requested V3 launch commit.
# No background deployment on ordinary main pushes; fail closed on failed V3 gates.
name: Calendar Post-V3 Production Acceptance

on:
  workflow_run:
    workflows: ["V3 Release - GHCR to Cloud Run"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  calendar-production:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.message == 'ci(calendar): launch guarded one-time V3 release'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify successful V3 release and pinned main
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$SOURCE_SHA"
          RELEASE_RUN_ID="${{ github.event.workflow_run.id }}"
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100")"
          printf '%s' "$JOBS" | jq -e '
            [.jobs[].steps[] |
             select(.name=="Post-promotion live health, OAuth redirect, PostgreSQL and access gates" or
                    .name=="Controlled rollback rehearsal and restore promoted live traffic" or
                    .name=="Retain latest 10 revisions after all live gates PASS") |
             select(.conclusion=="success") | .name] | unique | length==3'
          echo "v3_release_gates=PASS sha=$SOURCE_SHA run=$RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Release production frontend and run true Calendar account test
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$SOURCE_SHA"
          gh workflow run deploy-firebase-hosting.yml --ref main
          gh workflow run calendar-true-account-acceptance.yml --ref main
          echo "firebase_production=REQUESTED sha=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "calendar_true_account=REQUESTED sha=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Firebase production then run desktop and mobile Calendar UI
        shell: bash
        run: |
          set -euo pipefail
          wait_dispatch() {
            local workflow="$1" attempts="$2" json row status result url
            for ((attempt=1; attempt<=attempts; attempt++)); do
              json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=50")"
              row="$(printf '%s' "$json" | jq -c --arg sha "$SOURCE_SHA" '
                [.workflow_runs[] | select(.head_sha==$sha and .event=="workflow_dispatch")]
                | sort_by(.run_number) | last // null')"
              if [ "$row" != "null" ]; then
                status="$(printf '%s' "$row" | jq -r '.status')"
                if [ "$status" = "completed" ]; then
                  result="$(printf '%s' "$row" | jq -r '.conclusion')"
                  url="$(printf '%s' "$row" | jq -r '.html_url')"
                  echo "$workflow=$result url=$url" >> "$GITHUB_STEP_SUMMARY"
                  [ "$result" = "success" ] || { echo "::error::$workflow failed: $url"; return 1; }
                  return 0
                fi
              fi
              sleep 15
            done
            echo "::error::No completed same-SHA run for $workflow"
            return 1
          }
          wait_dispatch deploy-firebase-hosting.yml 120
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$SOURCE_SHA"
          gh workflow run calendar-ui-acceptance.yml --ref main
          echo "calendar_ui=REQUESTED sha=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          wait_dispatch calendar-ui-acceptance.yml 90
          wait_dispatch calendar-true-account-acceptance.yml 45
          echo "calendar_release_level_e2e=PASS" >> "$GITHUB_STEP_SUMMARY"
