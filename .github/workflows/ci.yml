name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'

      - name: Prepare and verify branding assets
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python -m unittest tests/test_branding_assets.py -v
          python scripts/prepare_branding_assets.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          checks = {
              'web/icons/life-assistant-192-v8.png': (192, 192),
              'web/icons/life-assistant-512-v8.png': (512, 512),
              'web/branding/life-assistant-hero-v8.png': (1024, 1024),
              'android/app/src/main/res/drawable/life_assistant_icon.png': (1024, 1024),
          }
          for name, expected in checks.items():
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 4000, name
              with Image.open(path) as image:
                  assert image.format == 'PNG' and image.size == expected, (name, image.size)
          print('branding_assets=PASS')
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Flutter CI
        run: |
          flutter pub get
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub --reporter expanded
          flutter build web --target=lib/main_web.dart --no-pub

      - name: Verify branding in web build
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name, expected in [
              ('build/web/icons/life-assistant-192-v8.png', (192, 192)),
              ('build/web/icons/life-assistant-512-v8.png', (512, 512)),
              ('build/web/branding/life-assistant-hero-v8.png', (1024, 1024)),
          ]:
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 4000, name
              with Image.open(path) as image:
                  assert image.format == 'PNG' and image.size == expected, (name, image.size)
          PY
          grep -Fq '/manifest-v6.json' build/web/index.html
          grep -Fq '/icons/life-assistant-192-v8.png' build/web/manifest-v6.json
          grep -Fq '/icons/life-assistant-512-v8.png' build/web/manifest-v6.json

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install and verify backend
        run: |
          pip install -r requirements.txt
          python -c "from app.main import app; print('OK')"
          alembic upgrade head --sql > /tmp/life-assistant-migrations.sql
          python -m unittest discover -s tests -v

  free-events-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: free_events_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d free_events_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/free_events_ci
      FREE_EVENTS_INTEGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/free_events_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        run: |
          alembic upgrade head
          alembic current

      - name: Run PostgreSQL integration tests
        run: |
          python -m unittest discover -s tests -p 'test_free_events_*postgres*.py' -v
          python -m unittest discover -s tests -p 'test_curated_postgres_integration.py' -v
          python -m scripts.run_curated_pool_runtime_acceptance
          python -m scripts.run_private_ownership_acceptance
          python -m scripts.run_drive_ai_enrichment_acceptance

      - name: Test schema collision recovery
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE free_events_precreated_ci'
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/free_events_precreated_ci
          alembic upgrade 20261007_0010
          python - <<'PY'
          import asyncio
          from app.db.session import Base, engine
          from app.models.free_events import FreeEventSourceObservation
          async def simulate_old_api():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
          asyncio.run(simulate_old_api())
          PY
          alembic upgrade 20261009_0014
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from app.db.session import engine
          async def verify():
              async with engine.connect() as conn:
                  assert await conn.scalar(text('SELECT version_num FROM alembic_version')) == '20261009_0014'
                  assert await conn.scalar(text("""SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname='public' AND tablename LIKE 'free_event_%'""")) == 9
              print('precreated_schema_reconciliation=PASS')
          asyncio.run(verify())
          PY

  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate GitHub Actions YAML
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              data=yaml.safe_load(path.read_text(encoding="utf-8"))
              assert isinstance(data, dict) and "jobs" in data, path
              assert isinstance(data["jobs"], dict) and data["jobs"], path
          print("workflow_yaml_syntax=PASS")
          PY

      - name: Validate script syntax
        run: |
          # Shell scripts
          bash -n scripts/bootstrap_gcp_wif.sh
          bash -n scripts/v3_fixed_staging_release.sh
          bash -n scripts/inspect_postgres_dev.sh
          bash -n scripts/diagnose_db_secret.sh
          bash -n scripts/rotate_google_oauth_secret.sh
          bash -n .github/scripts/run_cloud_run_job_with_diagnostics.sh
          # Node scripts
          for f in .github/scripts/verify_*.mjs .github/scripts/diagnose_*.mjs; do
            [ -f "$f" ] && node --check "$f"
          done
          # Python scripts
          python -m py_compile \
            backend/scripts/run_drive_knowledge_runtime_acceptance.py \
            backend/scripts/run_drive_google_integration_acceptance.py \
            backend/scripts/run_curated_pool_runtime_acceptance.py \
            .github/scripts/v3_firebase_error.py \
            .github/scripts/v3_gcs_object_inventory.py \
            .github/scripts/v3_image_identity.py \
            .github/scripts/v3_curated_handoff_alignment.py \
            .github/scripts/v3_revision_retention.py \
            .github/scripts/v3_gcp_inventory.py \
            .github/scripts/v3_free_event_retirement_readback.py \
            .github/scripts/v3_staging_gate.py

      - name: Run deployment script tests
        run: |
          python -m unittest \
            tests/test_v3_verify_preview.py \
            tests/test_v3_firebase_error.py \
            tests/test_v3_image_identity.py \
            tests/test_v3_curated_handoff_alignment.py \
            tests/test_v3_revision_retention.py \
            tests/test_life_cloud_run_retirement.py \
            tests/test_v3_staging_gate.py \
            tests/test_v3_workflow_consolidation.py \
            tests/test_v3_auto_production_hosting_workflow.py \
            tests/test_v3_release_no_oauth_gate.py \
            tests/test_v3_free_event_retirement_readback.py \
            -v
