name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare branding assets
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/prepare_branding_assets.py
          test "$(sha256sum web/icons/life-assistant-192-v6.png | awk '{print $1}')" = "9e0cd02d7036fcb6475d8fcb8f23cf30d280c5fdb68559028a029b9ad4837575"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

      - name: Build Web
        run: flutter build web --target=lib/main_web.dart --no-pub

      - name: Verify branding in web build
        run: |
          test "$(sha256sum build/web/icons/life-assistant-192-v6.png | awk '{print $1}')" = "9e0cd02d7036fcb6475d8fcb8f23cf30d280c5fdb68559028a029b9ad4837575"
          test -s build/web/icons/life-assistant-512-v6.png
          test -s build/web/branding/life-assistant-hero-v6.png
          grep -Fq '/manifest-v6.json' build/web/index.html

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check import
        run: python -c "from app.main import app; print('OK')"

      - name: Validate Alembic migrations
        run: alembic upgrade head --sql > /tmp/life-assistant-migrations.sql

      - name: Test backend
        run: python -m unittest discover -s tests -v

  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check GCP scripts syntax
        run: |
          bash -n scripts/bootstrap_gcp_wif.sh
          bash -n scripts/inspect_postgres_dev.sh
          bash -n scripts/diagnose_db_secret.sh
          bash -n scripts/rotate_google_oauth_secret.sh
