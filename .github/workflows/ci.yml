name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

      - name: Build Web
        run: flutter build web --target=lib/main_web.dart --no-pub

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check import
        run: python -c "from app.main import app; print('OK')"

      - name: Test backend
        run: python -m unittest discover -s tests -v

  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check GCP scripts syntax
        run: |
          bash -n scripts/bootstrap_gcp_wif.sh
          bash -n scripts/inspect_postgres_dev.sh
          bash -n scripts/diagnose_db_secret.sh
