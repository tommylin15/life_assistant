name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install branding tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Test branding source quality
        run: python -m unittest tests/test_branding_assets.py -v

      - name: Prepare branding assets
        run: |
          python scripts/prepare_branding_assets.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          checks = {
              'web/icons/life-assistant-192-v8.png': (192, 192),
              'web/icons/life-assistant-512-v8.png': (512, 512),
              'web/branding/life-assistant-hero-v8.png': (1024, 1024),
              'android/app/src/main/res/drawable/life_assistant_icon.png': (1024, 1024),
          }
          for name, expected in checks.items():
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 4000, name
              with Image.open(path) as image:
                  assert image.format == 'PNG', (name, image.format)
                  assert image.size == expected, (name, image.size)
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test Drive navigation
        run: flutter test --no-pub test/drive_navigation_test.dart --reporter expanded

      - name: Test
        run: flutter test --no-pub --reporter expanded

      - name: Build Web
        run: flutter build web --target=lib/main_web.dart --no-pub

      - name: Verify branding in web build
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          checks = {
              'build/web/icons/life-assistant-192-v8.png': (192, 192),
              'build/web/icons/life-assistant-512-v8.png': (512, 512),
              'build/web/branding/life-assistant-hero-v8.png': (1024, 1024),
          }
          for name, expected in checks.items():
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 4000, name
              with Image.open(path) as image:
                  assert image.format == 'PNG', (name, image.format)
                  assert image.size == expected, (name, image.size)
          PY
          grep -Fq '/manifest-v6.json' build/web/index.html
          grep -Fq '/icons/life-assistant-192-v8.png' build/web/manifest-v6.json
          grep -Fq '/icons/life-assistant-512-v8.png' build/web/manifest-v6.json

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check import
        run: python -c "from app.main import app; print('OK')"

      - name: Validate Alembic migrations
        run: alembic upgrade head --sql > /tmp/life-assistant-migrations.sql

      - name: Test backend
        run: python -m unittest discover -s tests -v

  # Independent local PostgreSQL service; never reads production credentials.
  # Runs the genuine Alembic chain and executes transactional/concurrency checks.
  free-events-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: free_events_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d free_events_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/free_events_ci
      FREE_EVENTS_INTEGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/free_events_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Verify fresh database upgrades through 0010 to 0011
        run: |
          alembic upgrade 20261007_0010
          alembic current
          alembic upgrade 20261009_0011
          alembic current
          alembic upgrade 20261009_0012
          alembic current
          alembic upgrade 20261009_0013
          alembic current
          alembic upgrade 20261009_0014
          alembic current
          alembic upgrade 20261010_0015
          alembic current
      - name: Verify real PostgreSQL transactions, constraints, concurrency and read filters
        run: python -m unittest discover -s tests -p 'test_free_events_*postgres*.py' -v
      - name: Verify curated ingestion and per-user preferences on real PostgreSQL
        run: python -m unittest discover -s tests -p 'test_curated_postgres_integration.py' -v
      - name: Verify rollback-only 0015 production-style runtime smoke on CI PostgreSQL
        run: python -m scripts.run_curated_pool_runtime_acceptance
      - name: Reproduce historical API create_all table collision and safely adopt schema
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE free_events_precreated_ci'
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/free_events_precreated_ci
          alembic upgrade 20261007_0010
          python - <<'PY'
          import asyncio
          from app.db.session import Base, engine
          from app.models.free_events import FreeEventSourceObservation
          async def simulate_old_api():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
          asyncio.run(simulate_old_api())
          PY
          alembic upgrade 20261009_0013
          alembic current
          alembic upgrade 20261009_0014
          alembic current
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from app.db.session import engine
          async def verify():
              async with engine.connect() as conn:
                  assert await conn.scalar(text('SELECT version_num FROM alembic_version')) == '20261009_0014'
                  assert await conn.scalar(text("""SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname='public' AND tablename LIKE 'free_event_%'""")) == 9
              print('precreated_schema_reconciliation=PASS (additive, no stamp/drop)')
          asyncio.run(verify())
          PY

  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check deployment acceptance syntax
        run: |
          bash -n scripts/bootstrap_gcp_wif.sh
          bash -n scripts/v3_fixed_staging_release.sh
          bash -n scripts/inspect_postgres_dev.sh
          bash -n scripts/diagnose_db_secret.sh
          bash -n scripts/rotate_google_oauth_secret.sh
          bash -n .github/scripts/run_cloud_run_job_with_diagnostics.sh
          node --check .github/scripts/verify_task_ui_production.mjs
          node --check .github/scripts/verify_project_ui_production.mjs
          node --check .github/scripts/verify_habits_ui_production.mjs
          node --check .github/scripts/verify_drive_knowledge_production.mjs
          python -m py_compile backend/scripts/run_drive_knowledge_runtime_acceptance.py
          python -m py_compile backend/scripts/run_drive_google_integration_acceptance.py
          python -m py_compile backend/scripts/run_curated_pool_runtime_acceptance.py
          python -m py_compile backend/scripts/verify_staging_google_e2e.py
          python -m py_compile .github/scripts/v3_firebase_error.py
          python -m py_compile .github/scripts/v3_gcs_object_inventory.py
          python -m py_compile .github/scripts/v3_image_identity.py
          python -m py_compile .github/scripts/v3_revision_retention.py
          python -m py_compile .github/scripts/v3_gcp_inventory.py
          python -m py_compile .github/scripts/v3_free_event_retirement_readback.py
          python -m py_compile .github/scripts/v3_staging_gate.py

      - name: Test bounded Firebase Preview propagation and strict SHA/401 readiness
        run: python -m unittest tests/test_v3_verify_preview.py -v

      - name: Test V3 Firebase CLI diagnostics secret redaction
        run: python -m unittest tests/test_v3_firebase_error.py -v

      - name: Test V3 Cloud Run GHCR digest/cache identity
        run: python -m unittest tests/test_v3_image_identity.py -v

      - name: Test V3 revision retention fail-closed contracts
        run: python -m unittest tests/test_v3_revision_retention.py -v

      - name: Test V3 staging version and pinned Cloud Run revision gates
        run: python -m unittest tests/test_v3_staging_gate.py -v
      - name: Test retired free-events Scheduler classification
        run: python -m unittest tests/test_v3_free_event_retirement_readback.py -v
