name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install branding tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Test branding source quality
        run: python -m unittest tests/test_branding_assets.py -v

      - name: Prepare branding assets
        run: |
          python scripts/prepare_branding_assets.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          checks = {
              'web/icons/life-assistant-192-v8.png': (192, 192),
              'web/icons/life-assistant-512-v8.png': (512, 512),
              'web/branding/life-assistant-hero-v8.png': (1024, 1024),
              'android/app/src/main/res/drawable/life_assistant_icon.png': (1024, 1024),
          }
          for name, expected in checks.items():
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 4000, name
              with Image.open(path) as image:
                  assert image.format == 'PNG', (name, image.format)
                  assert image.size == expected, (name, image.size)
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

      - name: Build Web
        run: flutter build web --target=lib/main_web.dart --no-pub

      - name: Verify branding in web build
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          checks = {
              'build/web/icons/life-assistant-192-v8.png': (192, 192),
              'build/web/icons/life-assistant-512-v8.png': (512, 512),
              'build/web/branding/life-assistant-hero-v8.png': (1024, 1024),
          }
          for name, expected in checks.items():
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 4000, name
              with Image.open(path) as image:
                  assert image.format == 'PNG', (name, image.format)
                  assert image.size == expected, (name, image.size)
          PY
          grep -Fq '/manifest-v6.json' build/web/index.html
          grep -Fq '/icons/life-assistant-192-v8.png' build/web/manifest-v6.json
          grep -Fq '/icons/life-assistant-512-v8.png' build/web/manifest-v6.json

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check import
        run: python -c "from app.main import app; print('OK')"

      - name: Validate Alembic migrations
        run: alembic upgrade head --sql > /tmp/life-assistant-migrations.sql

      - name: Test backend
        run: python -m unittest discover -s tests -v

  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check GCP scripts syntax
        run: |
          bash -n scripts/bootstrap_gcp_wif.sh
          bash -n scripts/inspect_postgres_dev.sh
          bash -n scripts/diagnose_db_secret.sh
          bash -n scripts/rotate_google_oauth_secret.sh
