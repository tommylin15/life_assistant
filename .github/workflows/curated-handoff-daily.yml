name: Curated Sheet Handoff (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: life-assistant-v3-production-release
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main' && vars.LIFE_CURATED_HANDOFF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB: life-assistant-free-events
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Verify job matches production
        run: |
          # Get production image
          LIVE_REV="$(gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='json(status.traffic)' | jq -r '[.status.traffic[] | select(.percent==100)][0].revisionName')"
          PROD_IMAGE="$(gcloud run revisions describe "$LIVE_REV" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.containers[0].image)')"
          
          # Get job image
          JOB_IMAGE="$(gcloud run jobs describe "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          
          test "$PROD_IMAGE" = "$JOB_IMAGE"

      - uses: ./.github/actions/run-acceptance-job
        with:
          job_name: ${{ env.JOB }}
          module: scripts.import_curated_from_sheet
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
