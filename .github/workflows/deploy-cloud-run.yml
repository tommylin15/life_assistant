name: Deploy Cloud Run

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      CLOUD_RUN_SERVICE: life-assistant-api
      GCP_NETWORK: janusai-lake-poc
      GCP_SUBNET: janusai-lake-poc-uscentral1

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Classify life-assistant bundle shape
        shell: bash
        run: |
          gcloud secrets versions access latest \
            --project "$GCP_PROJECT_ID" \
            --secret life-assistant-bundle \
          | python3 -c '
          import json
          import re
          import sys

          raw = sys.stdin.read().strip()
          if not raw:
              print("bundle_format=empty")
              raise SystemExit(0)

          try:
              value = json.loads(raw)
          except json.JSONDecodeError:
              value = None

          if isinstance(value, dict):
              print("bundle_format=json-object")
              print("bundle_keys=" + ",".join(sorted(str(key) for key in value)))
              raise SystemExit(0)

          lines = [line.strip() for line in raw.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          dotenv_keys = []
          dotenv = bool(lines)
          for line in lines:
              match = re.match(r"^(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)=", line)
              if not match:
                  dotenv = False
                  break
              dotenv_keys.append(match.group(1))
          if dotenv:
              print("bundle_format=dotenv")
              print("bundle_keys=" + ",".join(sorted(set(dotenv_keys))))
          elif raw.startswith(("postgresql://", "postgresql+asyncpg://")):
              print("bundle_format=raw-database-url")
              print("bundle_keys=DATABASE_URL")
          else:
              print("bundle_format=unknown")
          '

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source backend \
            --network "$GCP_NETWORK" \
            --subnet "$GCP_SUBNET" \
            --vpc-egress private-ranges-only \
            --update-secrets LIFE_ASSISTANT_BUNDLE=life-assistant-bundle:latest \
            --quiet

      - name: Resolve Cloud Run service URL
        id: service_url
        run: |
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          test -n "$SERVICE_URL"
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Mint Cloud Run health ID token
        id: health_auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service_url.outputs.url }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify Cloud Run health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --header "Authorization: Bearer ${{ steps.health_auth.outputs.id_token }}" \
            "${{ steps.service_url.outputs.url }}/health"

      - name: Verify Cloud Run database readiness
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 3 --retry-all-errors \
            --header "Authorization: Bearer ${{ steps.health_auth.outputs.id_token }}" \
            "${{ steps.service_url.outputs.url }}/ready"
