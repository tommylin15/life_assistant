# Manual fallback for Cloud Run deployment.
# Normal releases use v3-release-ghcr.yml.
name: Deploy Cloud Run (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      CLOUD_RUN_SERVICE: life-assistant-api
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        id: image
        run: |
          IMAGE_TAG="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run-source-deploy/life-assistant-backend:${RELEASE_SHA}"
          gcloud builds submit backend \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --tag "$IMAGE_TAG" --quiet
          
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" \
            --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          echo "ref=${IMAGE_TAG%:*}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Run migration
        run: |
          gcloud run jobs update life-assistant-db-migrate \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "${{ steps.image.outputs.ref }}" --quiet
          
          .github/scripts/run_cloud_run_job_with_diagnostics.sh life-assistant-db-migrate \
            gcloud run jobs execute life-assistant-db-migrate \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --args=-m,scripts.apply_cloud_domain_parity_release \
            --task-timeout 10m --wait --quiet

      - name: Deploy
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "${{ steps.image.outputs.ref }}" \
            --allow-unauthenticated --quiet

      - name: Verify
        run: |
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')"
          curl --fail --silent --retry 5 "$SERVICE_URL/health" >/dev/null
          curl --fail --silent --retry 3 "$SERVICE_URL/ready" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SERVICE_URL/api/v1/tasks")" = 401
