# Manual fallback for Firebase Hosting deployment.
# Normal releases use v3-release-ghcr.yml which includes hosting.
name: Deploy Firebase Hosting (Manual)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "SHA to deploy (defaults to current main)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare branding
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/prepare_branding_assets.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Build Flutter web
        run: |
          flutter pub get
          flutter build web --target=lib/main_web.dart --no-pub
          printf '%s\n' "$RELEASE_SHA" > build/web/release.txt

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy
        run: |
          npm install --global firebase-tools
          firebase deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive

      - name: Verify
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          for i in {1..12}; do
            SHA="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/release.txt" || true)"
            [ "$SHA" = "$RELEASE_SHA" ] && break
            sleep 5
          done
          test "$SHA" = "$RELEASE_SHA"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/v1/tasks")" = 401
