name: Deploy Firebase Hosting

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firebase-hosting-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --target=lib/main_web.dart --no-pub

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive

      - name: Verify Firebase Hosting
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$BASE_URL/" >/dev/null

          API_STATUS="$(curl --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output /tmp/tasks-body \
            --write-out '%{http_code}' \
            "$BASE_URL/api/v1/tasks")"
          test "$API_STATUS" = "401"

          AUTH_HEADERS="$(mktemp)"
          AUTH_STATUS="$(curl --silent --show-error \
            --output /dev/null \
            --dump-header "$AUTH_HEADERS" \
            --write-out '%{http_code}' \
            "$BASE_URL/auth/login")"
          case "$AUTH_STATUS" in
            302|303|307|308) ;;
            *) echo "Unexpected auth status: $AUTH_STATUS" >&2; exit 1 ;;
          esac
          grep -Eiq '^location: https://accounts\.google\.com/o/oauth2/v2/auth' "$AUTH_HEADERS"
          grep -Eiq '^set-cookie: __session=' "$AUTH_HEADERS"
