name: Deploy Firebase Hosting

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firebase-hosting-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare branding assets
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/prepare_branding_assets.py
          echo "EXPECTED_ICON_SHA=$(sha256sum web/icons/life-assistant-192-v6.png | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "EXPECTED_HERO_SHA=$(sha256sum web/branding/life-assistant-hero-v6.png | awk '{print $1}')" >> "$GITHUB_ENV"
          python - <<'PY'
          from PIL import Image
          checks = {
              'web/icons/life-assistant-192-v6.png': (192, 192),
              'web/icons/life-assistant-512-v6.png': (512, 512),
              'web/branding/life-assistant-hero-v6.png': (512, 512),
          }
          for name, expected in checks.items():
              with Image.open(name) as image:
                  assert image.format == 'PNG', (name, image.format)
                  assert image.size == expected, (name, image.size)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --target=lib/main_web.dart --no-pub

      - name: Stamp release commit
        run: printf '%s\n' "$RELEASE_SHA" > build/web/release.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive

      - name: Verify Firebase Hosting
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$BASE_URL/" >/dev/null

          REMOTE_RELEASE="$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$BASE_URL/release.txt")"
          test "$REMOTE_RELEASE" = "$RELEASE_SHA"

          CACHE_CONTROL="$(curl --silent --show-error --head "$BASE_URL/index.html" | tr -d '\r' | grep -i '^cache-control:' || true)"
          echo "$CACHE_CONTROL" | grep -Eiq 'no-cache|no-store|must-revalidate'

          API_STATUS="$(curl --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --output /tmp/tasks-body \
            --write-out '%{http_code}' \
            "$BASE_URL/api/v1/tasks")"
          test "$API_STATUS" = "401"

          AUTH_HEADERS="$(mktemp)"
          AUTH_STATUS="$(curl --silent --show-error \
            --output /dev/null \
            --dump-header "$AUTH_HEADERS" \
            --write-out '%{http_code}' \
            "$BASE_URL/auth/login")"
          case "$AUTH_STATUS" in
            302|303|307|308) ;;
            *) echo "Unexpected auth status: $AUTH_STATUS" >&2; exit 1 ;;
          esac
          grep -Eiq '^location: https://accounts\.google\.com/o/oauth2/v2/auth' "$AUTH_HEADERS"
          grep -Eiq '^set-cookie: __session=' "$AUTH_HEADERS"

          ICON_HEADERS="$(mktemp)"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --dump-header "$ICON_HEADERS" \
            --output /tmp/life-assistant-192-v6.png \
            "$BASE_URL/icons/life-assistant-192-v6.png"
          grep -Eiq '^content-type: image/png' "$ICON_HEADERS"
          test "$(sha256sum /tmp/life-assistant-192-v6.png | awk '{print $1}')" = "$EXPECTED_ICON_SHA"

          HERO_HEADERS="$(mktemp)"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --dump-header "$HERO_HEADERS" \
            --output /tmp/life-assistant-hero-v6.png \
            "$BASE_URL/branding/life-assistant-hero-v6.png"
          grep -Eiq '^content-type: image/png' "$HERO_HEADERS"
          test "$(sha256sum /tmp/life-assistant-hero-v6.png | awk '{print $1}')" = "$EXPECTED_HERO_SHA"

          python - <<'PY'
          from PIL import Image
          icon = Image.open('/tmp/life-assistant-192-v6.png')
          hero = Image.open('/tmp/life-assistant-hero-v6.png')
          assert icon.size == (192, 192), icon.size
          assert hero.size == (512, 512), hero.size
          PY

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "$BASE_URL/manifest-v6.json" > /tmp/manifest-v6.json
          grep -Fq '"id": "/life-assistant-v6"' /tmp/manifest-v6.json
          grep -Fq '/icons/life-assistant-192-v6.png' /tmp/manifest-v6.json
          grep -Fq '/icons/life-assistant-512-v6.png' /tmp/manifest-v6.json
