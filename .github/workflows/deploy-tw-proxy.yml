name: Deploy Taiwan Activity Proxy (Cloud Run)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'services/tw_activity_proxy/**'
      - '.github/workflows/deploy-tw-proxy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: asia-east1
      SERVICE_NAME: tw-activity-proxy
      INVOKER_SA: postgres-vm@gen-lang-client-0593591102.iam.gserviceaccount.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run service to asia-east1
        run: |
          echo "Deploying ${{ env.SERVICE_NAME }} to ${{ env.GCP_REGION }} in ${{ env.GCP_PROJECT_ID }}..."
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --source=services/tw_activity_proxy \
            --no-allow-unauthenticated \
            --timeout=120s \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=5 \
            --quiet

      - name: Set invoker policy binding for VM service account
        run: |
          echo "Binding run.invoker role for ${{ env.INVOKER_SA }}..."
          gcloud run services add-iam-policy-binding "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --member="serviceAccount:${{ env.INVOKER_SA }}" \
            --role="roles/run.invoker" \
            --quiet || true

      - name: Output Service URL
        run: |
          URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --project="${{ env.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" --format='value(status.url)')"
          echo "PROXY_URL=${URL}" >> $GITHUB_ENV
          echo "Service deployed successfully at ${URL}"
