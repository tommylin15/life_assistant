name: Taiwan proxy safe CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/tw_activity_proxy/**'
      - 'backend/app/services/tw_request_router.py'
      - 'backend/tests/test_tw_request_router.py'
      - '.github/workflows/deploy-tw-proxy.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/tw_activity_proxy/requirements.txt pytest requests
      - run: python -m pytest -q services/tw_activity_proxy/test_proxy.py backend/tests/test_tw_request_router.py
        env:
          PYTHONPATH: backend
