name: Drive Knowledge Runtime Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: drive-knowledge-runtime-acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB: life-assistant-postdeploy-acceptance
      DRIVE_ACCEPTANCE_USER_SUB: ${{ vars.DRIVE_ACCEPTANCE_USER_SUB }}
      DRIVE_ACCEPTANCE_GOOGLE_FILE_ID: ${{ vars.DRIVE_ACCEPTANCE_GOOGLE_FILE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Resolve and update job image
        run: |
          REV="$(gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.latestReadyRevisionName)')"
          IMAGE="$(gcloud run revisions describe "$REV" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.containers[0].image)')"
          
          gcloud run jobs update "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" \
            --update-env-vars "DRIVE_ACCEPTANCE_USER_SUB=$DRIVE_ACCEPTANCE_USER_SUB,DRIVE_ACCEPTANCE_GOOGLE_FILE_ID=$DRIVE_ACCEPTANCE_GOOGLE_FILE_ID,CODEX_PRIMARY_ENABLED=true" \
            --quiet

      - name: Run acceptance modules
        id: acceptance
        run: |
          FAILED=0
          for module in \
            scripts.run_drive_production_config_acceptance \
            scripts.run_drive_knowledge_runtime_acceptance \
            scripts.run_shared_codex_identity_acceptance \
            scripts.run_drive_external_ai_acceptance; do
            if ! .github/scripts/run_cloud_run_job_with_diagnostics.sh "$JOB" \
              gcloud run jobs execute "$JOB" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --args="-m,$module" --task-timeout 10m --wait --quiet; then
              echo "::error::$module failed"
              FAILED=1
            fi
          done
          
          # Real Google integration (if configured)
          if [ -n "$DRIVE_ACCEPTANCE_USER_SUB" ] && [ -n "$DRIVE_ACCEPTANCE_GOOGLE_FILE_ID" ]; then
            if ! .github/scripts/run_cloud_run_job_with_diagnostics.sh "$JOB" \
              gcloud run jobs execute "$JOB" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --args=-m,scripts.run_drive_google_integration_acceptance \
              --task-timeout 10m --wait --quiet; then
              echo "::error::Real Google integration failed"
              FAILED=1
            fi
          fi
          
          exit $FAILED

      - name: Verify Firebase release
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          SHA="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE_URL/release.txt")"
          test "$SHA" = "${{ github.sha }}"

      - uses: ./.github/actions/setup-playwright

      - name: Run UI acceptance
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app" \
            node .github/scripts/verify_drive_knowledge_production.mjs
