name: Drive Knowledge UI Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drive-knowledge-runtime-acceptance-main-${{ github.event.workflow_run.conclusion || 'success' }}
  cancel-in-progress: false

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Verify production Hosting release SHA
        run: |
          set -euo pipefail
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          REMOTE_RELEASE="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$BASE_URL/release.txt?drive_ui_acceptance=$RELEASE_SHA")"
          test "$REMOTE_RELEASE" = "$RELEASE_SHA"
          echo "drive_knowledge_frontend_release=PASS sha=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify OAuth client redirect configuration
        run: |
          set -euo pipefail
          HEADERS="$(mktemp)"
          STATUS="$(curl --silent --show-error --output /dev/null --dump-header "$HEADERS" --write-out '%{http_code}' "https://${GCP_PROJECT_ID}.web.app/auth/login")"
          case "$STATUS" in 302|303|307|308) ;; *) exit 1 ;; esac
          LOCATION="$(tr -d '\r' < "$HEADERS" | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location:[[:space:]]*/, ""); print; exit}')"
          python - "$LOCATION" <<'PY'
          import sys
          from urllib.parse import parse_qs, urlparse
          parsed = urlparse(sys.argv[1])
          params = parse_qs(parsed.query)
          assert parsed.hostname == "accounts.google.com"
          assert params.get("client_id", [""])[0].strip()
          print("drive_oauth_client_config=PASS")
          PY

      - name: Install UI acceptance tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Verify Drive Knowledge browser UI
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app" node .github/scripts/verify_drive_knowledge_production.mjs

      - name: Record retired backend gates
        if: always()
        run: |
          echo "drive_knowledge_ui_gate=${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "drive_backend_postdeploy_acceptance=RETIRED not_claimed_PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "real_google_provider_acceptance=NOT_VERIFIED by_this_workflow" >> "$GITHUB_STEP_SUMMARY"
