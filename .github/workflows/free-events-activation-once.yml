name: Free Events - One-Time Verified Production Activation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/free-events-activation-once.yml

permissions:
  contents: read
  checks: read
  actions: write
  id-token: write

concurrency:
  group: life-assistant-free-events-production-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: dev-test
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: tommylin15/life_assistant
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require exact main commit and all four CI jobs
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 100); do
            test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$GITHUB_SHA"
            CHECKS="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/check-runs?per_page=100")"
            if ! printf '%s' "$CHECKS" | jq -e '
              [.check_runs[] | select(
                .name=="backend" or .name=="flutter" or
                .name=="deployment-scripts" or .name=="free-events-postgres"
              ) | select(.conclusion=="failure" or .conclusion=="cancelled"
                  or .conclusion=="timed_out")] | length==0' >/dev/null; then
              echo "::error::One of four release source checks FAILED"
              exit 1
            fi
            PASSED="$(printf '%s' "$CHECKS" | jq '
              [.check_runs[] | select(
                .name=="backend" or .name=="flutter" or
                .name=="deployment-scripts" or .name=="free-events-postgres"
              ) | select(.conclusion=="success") | .name] | unique | length')"
            if [ "$PASSED" -eq 4 ]; then
              echo "production_release_ci=PASS sha=$GITHUB_SHA four_jobs=4" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Release source CI did not complete successfully in verification window"
          exit 1

      - name: Dispatch audited V3 immutable GHCR production promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$GITHUB_SHA"
          gh workflow run v3-release-ghcr.yml --ref main \
            -f release_sha="$GITHUB_SHA" -f promote=true
          echo "v3_release_dispatch=REQUESTED sha=$GITHUB_SHA promote=true" >> "$GITHUB_STEP_SUMMARY"

      - name: Await exact-SHA V3 result before any source job or Hosting work
        shell: bash
        run: |
          set -euo pipefail
          FOUND=""
          for ATTEMPT in $(seq 1 510); do
            FOUND="$(gh api "repos/$GH_REPO/actions/workflows/v3-release-ghcr.yml/runs?event=workflow_dispatch&per_page=15" \
              --jq ".workflow_runs[] | select(.head_sha==\"$GITHUB_SHA\") | .id" | head -1)"
            if [ -n "$FOUND" ]; then
              CONCLUSION="$(gh api repos/$GH_REPO/actions/runs/$FOUND --jq '.conclusion // empty')"
              case "$CONCLUSION" in
                success)
                  echo "v3_release=PASS run=$FOUND sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                  exit 0;;
                failure|cancelled|timed_out|action_required)
                  echo "::error::V3 release did not pass: $FOUND ($CONCLUSION)"
                  exit 1;;
              esac
            fi
            sleep 15
          done
          echo "::error::Timed out awaiting V3 success"
          exit 1

      - name: Authenticate GCP via existing WIF
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create isolated DB-only source observer job from verified acceptance template
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml==6.0.3
          gcloud run jobs describe life-assistant-core-acceptance \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format export > "$RUNNER_TEMP/core-job.yaml"
          python - "$RUNNER_TEMP/core-job.yaml" "$RUNNER_TEMP/free-events-job.yaml" <<'PY'
          import sys,yaml
          template=yaml.safe_load(open(sys.argv[1],encoding='utf-8'))
          assert template.get('kind')=='Job'
          spec=template['spec']['template']['spec']['template']['spec']
          containers=spec['containers']
          assert len(containers)==1
          container=containers[0]
          image=container['image']
          assert image.startswith('ghcr.io/tommylin15/life_assistant-backend@sha256:'), 'Unexpected template image'
          existing=container.get('env',[])
          safe=[v for v in existing if v.get('name')=='DATABASE_URL']
          assert len(safe)==1, 'No explicit DATABASE_URL in acceptance template; refuse to clone other secrets'
          container['env']=safe
          container['args']=['-m','scripts.run_free_events_moc_batch']
          template['metadata']['name']='life-assistant-free-events'
          for field in ('uid','resourceVersion','creationTimestamp','generation','selfLink'):
              template['metadata'].pop(field,None)
          template.pop('status',None)
          template['spec']['template']['spec']['taskCount']=1
          with open(sys.argv[2],'w',encoding='utf-8') as out:
              yaml.safe_dump(template,out,sort_keys=False)
          print('observer_config=PASS isolated_job_one_DB_secret')
          PY
          gcloud run jobs replace "$RUNNER_TEMP/free-events-job.yaml" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
          gcloud run jobs describe life-assistant-free-events \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            | jq -e '.metadata.name=="life-assistant-free-events"'
          echo "isolated_observer_job=PASS permissions_reused_no_new_IAM" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch production Firebase Hosting and the first real source observation
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$GITHUB_SHA"
          gh workflow run deploy-firebase-hosting.yml --ref main
          gh workflow run free-events-moc-observations.yml --ref main
          echo "firebase_and_first_moc_observation=DISPATCHED sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Hosting and first observation workflow results
        shell: bash
        run: |
          set -euo pipefail
          for WORKFLOW in deploy-firebase-hosting.yml free-events-moc-observations.yml; do
            MATCH=""
            for ATTEMPT in $(seq 1 180); do
              MATCH="$(gh api "repos/$GH_REPO/actions/workflows/$WORKFLOW/runs?event=workflow_dispatch&per_page=15" \
                --jq ".workflow_runs[] | select(.head_sha==\"$GITHUB_SHA\") | .id" | head -1)"
              if [ -n "$MATCH" ]; then
                RESULT="$(gh api repos/$GH_REPO/actions/runs/$MATCH --jq '.conclusion // empty')"
                if [ "$RESULT" = success ]; then
                  echo "$WORKFLOW=PASS run=$MATCH" >> "$GITHUB_STEP_SUMMARY"
                  break
                fi
                if [ -n "$RESULT" ]; then
                  echo "::error::$WORKFLOW run $MATCH result=$RESULT"
                  exit 1
                fi
              fi
              sleep 10
            done
            test -n "$MATCH" && [ "${RESULT:-}" = success ] || exit 1
            RESULT=""
          done
          echo "activation_stage=PASS (14-day source quality remains NOT VERIFIED)" >> "$GITHUB_STEP_SUMMARY"
