name: Free Events - P0 P2 One-Time Integrated Acceptance
# One-time exact-main V3 promotion and MoC Job digest cutover; never replaces DB/secrets.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/free-events-activation-once.yml

permissions:
  contents: read
  checks: read
  actions: write
  id-token: write

concurrency:
  group: life-assistant-free-events-production-activation
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: dev-test
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: tommylin15/life_assistant
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require exact main commit and all four CI jobs
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 100); do
            test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$GITHUB_SHA"
            CHECKS="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/check-runs?per_page=100")"
            if ! printf '%s' "$CHECKS" | jq -e '
              [.check_runs[] | select(
                .name=="backend" or .name=="flutter" or
                .name=="deployment-scripts" or .name=="free-events-postgres"
              ) | select(.conclusion=="failure" or .conclusion=="cancelled"
                  or .conclusion=="timed_out")] | length==0' >/dev/null; then
              echo "::error::One of four release source checks FAILED"
              exit 1
            fi
            PASSED="$(printf '%s' "$CHECKS" | jq '
              [.check_runs[] | select(
                .name=="backend" or .name=="flutter" or
                .name=="deployment-scripts" or .name=="free-events-postgres"
              ) | select(.conclusion=="success") | .name] | unique | length')"
            if [ "$PASSED" -eq 4 ]; then
              echo "production_release_ci=PASS sha=$GITHUB_SHA four_jobs=4" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Release source CI did not complete successfully in verification window"
          exit 1

      - name: Dispatch audited V3 immutable GHCR production promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$GITHUB_SHA"
          gh workflow run v3-release-ghcr.yml --ref main \
            -f release_sha="$GITHUB_SHA" -f promote=true
          echo "v3_release_dispatch=REQUESTED sha=$GITHUB_SHA promote=true" >> "$GITHUB_STEP_SUMMARY"

      - name: Await exact-SHA V3 result before any source job or Hosting work
        shell: bash
        run: |
          set -euo pipefail
          FOUND=""
          for ATTEMPT in $(seq 1 510); do
            FOUND="$(gh api "repos/$GH_REPO/actions/workflows/v3-release-ghcr.yml/runs?event=workflow_dispatch&per_page=15" \
              --jq ".workflow_runs[] | select(.head_sha==\"$GITHUB_SHA\") | .id" | head -1)"
            if [ -n "$FOUND" ]; then
              CONCLUSION="$(gh api repos/$GH_REPO/actions/runs/$FOUND --jq '.conclusion // empty')"
              case "$CONCLUSION" in
                success)
                  echo "v3_release=PASS run=$FOUND sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                  exit 0;;
                failure|cancelled|timed_out|action_required)
                  echo "::error::V3 release did not pass: $FOUND ($CONCLUSION)"
                  exit 1;;
              esac
            fi
            sleep 15
          done
          echo "::error::Timed out awaiting V3 success"
          exit 1

      - name: Authenticate GCP via existing WIF
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin existing MoC source Job to promoted immutable GHCR digest
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$GITHUB_SHA"
          gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/live-service.json"
          REVISION="$(jq -er '.status.traffic[] | select(.percent==100) | .revisionName' "$RUNNER_TEMP/live-service.json")"
          gcloud run revisions describe "$REVISION" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/live-revision.json"
          IMAGE="$(jq -er '.spec.containers[0].image' "$RUNNER_TEMP/live-revision.json")"
          [[ "$IMAGE" =~ ^ghcr\.io/tommylin15/life_assistant-backend@sha256:[0-9a-f]{64}$ ]]
          gcloud run jobs describe life-assistant-free-events \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/source-before.json"
          python - "$RUNNER_TEMP/source-before.json" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1],encoding='utf-8'))
          spec=o['spec']['template']['spec']['template']['spec']
          assert len(spec['containers'])==1
          c=spec['containers'][0]
          assert c.get('command') in (['python'],['python3'])
          assert c.get('args')==['-m','scripts.run_free_events_moc_batch']
          names={x.get('name') for x in c.get('env',[])}
          assert 'DATABASE_URL' in names or 'LIFE_ASSISTANT_BUNDLE' in names
          PY
          gcloud run jobs update life-assistant-free-events \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --quiet
          gcloud run jobs describe life-assistant-free-events \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/source-after.json"
          python - "$RUNNER_TEMP/source-before.json" "$RUNNER_TEMP/source-after.json" "$IMAGE" <<'PY'
          import json,sys
          b=json.load(open(sys.argv[1],encoding='utf-8'))
          a=json.load(open(sys.argv[2],encoding='utf-8'))
          bc=b['spec']['template']['spec']['template']['spec']['containers'][0]
          ac=a['spec']['template']['spec']['template']['spec']['containers'][0]
          assert ac.get('image')==sys.argv[3]
          for key in ('command','args','env'):
              assert ac.get(key)==bc.get(key)
          assert a['spec']['template']['spec']['template']['spec'].get('serviceAccountName') == b['spec']['template']['spec']['template']['spec'].get('serviceAccountName')
          PY
          echo "moc_job_immutable_live_image=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch one bounded official MoC observation
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$GITHUB_SHA"
          gh workflow run free-events-moc-observations.yml --ref main
          echo "moc_observation=DISPATCHED sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify source execution and owner status 401 isolation
        shell: bash
        run: |
          set -euo pipefail
          MATCH=""
          RESULT=""
          for ATTEMPT in $(seq 1 360); do
            MATCH="$(gh api "repos/$GH_REPO/actions/workflows/free-events-moc-observations.yml/runs?event=workflow_dispatch&per_page=15" \
              --jq ".workflow_runs[] | select(.head_sha==\"$GITHUB_SHA\") | .id" | head -1)"
            if [ -n "$MATCH" ]; then
              RESULT="$(gh api repos/$GH_REPO/actions/runs/$MATCH --jq '.conclusion // empty')"
              if [ "$RESULT" = success ]; then
                echo "moc_observation_workflow=PASS run=$MATCH" >> "$GITHUB_STEP_SUMMARY"
                break
              fi
              if [ -n "$RESULT" ]; then
                echo "::error::MoC observation did not pass: $MATCH ($RESULT)"
                exit 1
              fi
            fi
            sleep 10
          done
          test -n "$MATCH" && [ "$RESULT" = success ]
          API_URL="$(gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$API_URL/api/v1/free-events/status")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$API_URL/api/v1/free-events")" = 401
          echo "owner_status_anonymous_401=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "p0_production_owner_authenticated_db_counts=NOT_VERIFIED (owner session required)" >> "$GITHUB_STEP_SUMMARY"
          echo "p2_real_new_ingestion_count=NOT_VERIFIED (source may not be due)" >> "$GITHUB_STEP_SUMMARY"
          echo "p0_p2_combined=PARTIAL until owner readback and actual queue counts" >> "$GITHUB_STEP_SUMMARY"
