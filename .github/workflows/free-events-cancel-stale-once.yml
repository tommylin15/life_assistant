name: Free Events - Cancel Superseded Pre-Cutover V3 Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/free-events-cancel-stale-once.yml

permissions:
  contents: read
  actions: write

jobs:
  cancel-superseded:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: tommylin15/life_assistant
      OLD_RUN: 37917861746
    steps:
      - name: Confirm stale SHA and no previous production cutover
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api repos/$GH_REPO/commits/main --jq .sha)"
          OLD_SHA="$(gh api repos/$GH_REPO/actions/runs/$OLD_RUN --jq .head_sha)"
          if [ "$CURRENT" = "$OLD_SHA" ]; then
            echo "stale_release_cancellation=NOT_NEEDED same_sha" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATUS="$(gh api repos/$GH_REPO/actions/runs/$OLD_RUN --jq .status)"
          if [ "$STATUS" = completed ]; then
            echo "stale_release_cancellation=NOT_NEEDED completed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          JOBS="$(gh api "repos/$GH_REPO/actions/runs/$OLD_RUN/jobs?per_page=50")"
          PRE_CUTOVER="$(printf '%s' "$JOBS" | jq -er '
            [.jobs[].steps[] | select(.name=="Reconfirm source SHA and live traffic, then promote")
            | .status] | if length==1 then .[0] else error("cutover step not found") end')"
          if [ "$PRE_CUTOVER" != pending ] && [ "$PRE_CUTOVER" != queued ]; then
            echo "::error::Cutover step already began; will not cancel production workflow"
            exit 1
          fi
          gh api --method POST "repos/$GH_REPO/actions/runs/$OLD_RUN/cancel"
          echo "stale_release_cancellation=REQUESTED run=$OLD_RUN; verified no cutover initiated" >> "$GITHUB_STEP_SUMMARY"
