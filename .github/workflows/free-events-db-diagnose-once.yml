name: Free Events - One-Time DB Migration Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/free-events-db-diagnose-once.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: life-assistant-free-event-migration-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: dev-test
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Confirm safe job command and only print env NAMES
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs describe life-assistant-db-migrate \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/job.json"
          python - "$RUNNER_TEMP/job.json" <<'PY'
          import json,sys
          job=json.load(open(sys.argv[1],encoding='utf-8'))
          container=job['spec']['template']['spec']['template']['spec']['containers'][0]
          print('job_image_is_ghcr=',container.get('image','').startswith('ghcr.io/tommylin15/life_assistant-backend@sha256:'))
          print('container_command=',container.get('command',[]))
          print('env_key_names_only=',sorted(v.get('name') for v in container.get('env',[])))
          assert container.get('image','').startswith('ghcr.io/tommylin15/life_assistant-backend@sha256:')
          PY
      - name: Run DB-only read-only permission / Alembic preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/preflight.py" <<'PY'
          import asyncio
          import sys
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.config import settings

          async def main():
              engine=create_async_engine(settings.database_url,pool_pre_ping=True)
              try:
                  async with engine.connect() as c:
                      version=await c.scalar(text("SELECT version_num FROM alembic_version"))
                      can_create=await c.scalar(text("SELECT has_schema_privilege(current_user, 'public', 'CREATE')"))
                      can_usage=await c.scalar(text("SELECT has_schema_privilege(current_user, 'public', 'USAGE')"))
                      event_count=await c.scalar(text("SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname='public' AND tablename LIKE 'free_event_%'"))
                      # Pass via distinct non-secret exit codes, never database URLs or query values.
                      if not can_usage: sys.exit(71)
                      if not can_create: sys.exit(72)
                      if version not in ('20261007_0010','20261009_0011','20261009_0012','20261009_0013'): sys.exit(73)
                      if version=='20261007_0010' and event_count>0: sys.exit(74)
                      if version=='20261009_0013' and event_count<8: sys.exit(75)
                      if version=='20261009_0011' and event_count<6: sys.exit(76)
                      if version=='20261009_0012' and event_count<7: sys.exit(77)
              finally:
                  await engine.dispose()

          try:
              asyncio.run(main())
          except SystemExit:
              raise
          except Exception:
              sys.exit(78)
          PY
          PAYLOAD="$(base64 -w0 "$RUNNER_TEMP/preflight.py")"
          set +e
          gcloud run jobs execute life-assistant-db-migrate \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --args="-c,exec(__import__('base64').b64decode('$PAYLOAD'))" \
            --task-timeout 5m --wait --quiet
          COMMAND_EXIT=$?
          set -e
          EXECUTION="$(gcloud run jobs executions list --job life-assistant-db-migrate \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --sort-by='~metadata.creationTimestamp' --limit=1 --format='value(metadata.name)')"
          TASK="$(gcloud run jobs executions tasks list --execution "$EXECUTION" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --limit=1 --format='value(metadata.name)')"
          EXIT_CODE="$(gcloud run jobs executions tasks describe "$TASK" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.lastAttemptResult.exitCode)')"
          echo "db_preflight_runtime_exit_code=$EXIT_CODE"
          echo "db_preflight_exit_code=$EXIT_CODE" >> "$GITHUB_STEP_SUMMARY"
          case "$EXIT_CODE" in
            0) echo "db_preflight=PASS read_only" >> "$GITHUB_STEP_SUMMARY";;
            71) echo "::error::DB schema USAGE privilege absent"; exit 1;;
            72) echo "::error::DB schema CREATE privilege absent"; exit 1;;
            73) echo "::error::DB unexpected Alembic revision"; exit 1;;
            74|75|76|77) echo "::error::DB Alembic revision / free-event table mismatch"; exit 1;;
            78) echo "::error::DB read-only introspection/connection failure"; exit 1;;
            *) echo "::error::Diagnostic container did not complete safely: $EXIT_CODE (gcloud $COMMAND_EXIT)"; exit 1;;
          esac
