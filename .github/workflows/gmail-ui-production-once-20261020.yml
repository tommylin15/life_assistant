# ONE-TIME user-authorized 2026-10-20 Gmail mobile UI production release.
# Runs only on the exact new workflow + auto-staging skip child of the
# manually accepted, tested and staged Gmail compact UI. NOT automatic future
# production publishing; reuse from any other SHA is rejected.
# No direct GCP writes: dispatches the existing V3 same-SHA staging + production
# + rollback + Hosting gates, with ONNX explicitly disabled for production.
name: Gmail Mobile UI Production Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gmail-ui-production-once-20261020.yml'

permissions:
  contents: read
  actions: write
  checks: read

concurrency:
  group: gmail-mobile-ui-production-once-20261020
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
      EXPECTED_PARENT: fe62af8c084161b31b7bffdab3785bcadc4c15fb
      APPROVED_UI_SHA: 64cfecaec5e62fe4d77f5f94250ad154c4c7a0a5
      APPROVED_STAGING_RUN: '39418591499'
    steps:
      - name: Gate immutable one-time commit, accepted UI and exact main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$SOURCE_SHA"
          COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA?per_page=100")"
          jq -e --arg parent "$EXPECTED_PARENT" '
            (.parents | length)==1 and .parents[0].sha==$parent and
            ([.files[].filename] | sort) ==
              ([".github/workflows/gmail-ui-production-once-20261020.yml",
                ".github/workflows/v3-auto-staging-after-ci.yml"] | sort)
          ' <<< "$COMMIT" >/dev/null
          PARENT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_PARENT?per_page=100")"
          jq -e --arg tested "$APPROVED_UI_SHA" '
            (.parents | length)==1 and .parents[0].sha==$tested and
            all(.files[]; .filename | startswith("doc/"))
          ' <<< "$PARENT" >/dev/null
          STAGE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_STAGING_RUN")"
          jq -e --arg ui "$APPROVED_UI_SHA" '
            .head_sha==$ui and .status=="completed" and .conclusion=="success" and
            .event=="workflow_dispatch"
          ' <<< "$STAGE" >/dev/null
          echo "gmail_ui_accepted_staging=PASS sha=$APPROVED_UI_SHA run=$APPROVED_STAGING_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "release_scope=UI_COMPACT_AND_RULES_ONLY onnx=false" >> "$GITHUB_STEP_SUMMARY"

      - name: Require exact-source four-job push CI success
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 70); do
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$SOURCE_SHA"
            RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=30")"
            CI_RUN_ID="$(jq -r --arg sha "$SOURCE_SHA" '
              [.workflow_runs[] | select(.head_sha==$sha and .event=="push" and
                .head_branch=="main" and .status=="completed" and .conclusion=="success")
              | .id] | first // empty' <<< "$RUNS")"
            if [[ -n "$CI_RUN_ID" ]]; then
              JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")"
              if jq -e '
                [.jobs[] | select(.conclusion=="success") | .name] |
                unique | (index("backend")!=null and index("flutter")!=null and
                  index("free-events-postgres")!=null and index("deployment-scripts")!=null)
              ' <<< "$JOBS" >/dev/null; then
                echo "same_sha_ci=PASS sha=$SOURCE_SHA run=$CI_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            if [[ "$attempt" == 70 ]]; then
              echo "::error::same_sha_ci=NOT_VERIFIED; production not dispatched"
              exit 1
            fi
            sleep 12
          done

      - name: Dispatch existing V3 release with all gates, ONNX off
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$SOURCE_SHA"
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v3-release-ghcr.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$SOURCE_SHA" '
             any(.workflow_runs[]; .head_sha==$sha)
          ' <<< "$RUNS" >/dev/null; then
            echo "v3_dispatch=SKIPPED existing_release_for_sha=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run v3-release-ghcr.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --raw-field promote=true \
            --raw-field publish_staging=true \
            --raw-field enable_gmail_onnx=false
          echo "v3_dispatch=REQUESTED sha=$SOURCE_SHA promote=true publish_staging=true onnx=false" >> "$GITHUB_STEP_SUMMARY"
          echo "Await V3 Cloud Run, rollback, Hosting publish and live verification; dispatch is not PASS." >> "$GITHUB_STEP_SUMMARY"
