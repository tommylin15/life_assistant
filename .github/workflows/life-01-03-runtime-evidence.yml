name: Life Importer Evidence (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/life-01-03-runtime-evidence.yml

permissions:
  contents: read
  id-token: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB: life-assistant-free-events
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Read importer metadata
        run: |
          # Get job info
          gcloud run jobs describe "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/job.json"
          
          # Get production revision
          LIVE_REV="$(gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='json(status.traffic)' | jq -r '[.status.traffic[] | select(.percent==100)][0].revisionName // empty')"
          
          if [ -n "$LIVE_REV" ]; then
            gcloud run revisions describe "$LIVE_REV" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
              > "$RUNNER_TEMP/revision.json"
          fi
          
          # Get recent executions
          gcloud run jobs executions list --job "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --limit 10 --format=json > "$RUNNER_TEMP/executions.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/executions.json"

      - name: Generate summary
        run: |
          python - <<'PY'
          import json, os
          
          def load(name):
              try:
                  return json.load(open(f"{os.environ['RUNNER_TEMP']}/{name}"))
              except:
                  return {}
          
          job = load("job.json")
          rev = load("revision.json")
          execs = load("executions.json") or []
          
          job_image = job.get("spec", {}).get("template", {}).get("spec", {}).get("template", {}).get("spec", {}).get("containers", [{}])[0].get("image", "")
          rev_image = rev.get("spec", {}).get("containers", [{}])[0].get("image", "")
          
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              print("## Life Importer Evidence (read only)", file=f)
              print(f"- Job image: {job_image[:80]}...", file=f)
              print(f"- Production image: {rev_image[:80]}...", file=f)
              print(f"- Images match: {job_image == rev_image}", file=f)
              print(f"- Recent executions: {len(execs)}", file=f)
              for e in execs[:5]:
                  name = e.get("metadata", {}).get("name", "").split("/")[-1]
                  status = e.get("status", {}).get("conditions", [{}])[0].get("status", "?")
                  print(f"  - {name}: {status}", file=f)
          PY
