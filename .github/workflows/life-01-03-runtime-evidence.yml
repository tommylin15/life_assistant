name: Life Importer Evidence (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/life-01-03-runtime-evidence.yml

permissions:
  contents: read
  id-token: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB: life-assistant-free-events
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Read importer metadata
        run: |
          # Get job info
          gcloud run jobs describe "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/job.json"
          
          # Get production revision
          LIVE_REV="$(gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='json(status.traffic)' | jq -r '[.status.traffic[] | select(.percent==100)][0].revisionName // empty')"
          
          if [ -n "$LIVE_REV" ]; then
            gcloud run revisions describe "$LIVE_REV" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
              > "$RUNNER_TEMP/revision.json"
          fi
          
          # Get recent executions
          gcloud run jobs executions list --job "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --limit 10 --format=json > "$RUNNER_TEMP/executions.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/executions.json"

      - name: Read recent importer error signatures (read only)
        shell: bash
        run: |
          set -uo pipefail
          echo "## Recent Cloud Run importer logs (read only)" >> "$GITHUB_STEP_SUMMARY"
          # Never invoke the Job or display the raw payload. Only log stable,
          # redacted error categories and sanitized return codes.
          if ! gcloud logging read \
              'resource.type="cloud_run_job" AND resource.labels.job_name="life-assistant-free-events"' \
              --project "$GCP_PROJECT_ID" --freshness=72h --limit=150 \
              --format='value(textPayload)' > "$RUNNER_TEMP/importer-logs.txt" 2>"$RUNNER_TEMP/importer-log-error.txt"; then
            python - <<'PY'
          import os
          from pathlib import Path
          msg = Path(os.environ["RUNNER_TEMP"] + "/importer-log-error.txt").read_text(errors="replace").lower()
          kind = ("PERMISSION_DENIED" if any(k in msg for k in ("permission denied", "permission_denied", "logging.logentries.list", "403")) else
                  "NOT_FOUND" if "not found" in msg or "404" in msg else
                  "OTHER_API_ERROR" if msg.strip() else "EMPTY_ERROR")
          print(f"importer_logging_read=NOT_VERIFIED reason={kind}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              print(f"- logging_read=NOT_VERIFIED reason={kind}", file=f)
          PY
          else
            python - <<'PY'
          import collections, os
          from pathlib import Path

          log = Path(os.environ["RUNNER_TEMP"] + "/importer-logs.txt").read_text(errors="replace")
          print("importer_logging_read=PASS")
          patterns = {
              "invalid_handoff_record": "invalid_handoff_record",
              "duplicate_event_key": "missing_or_duplicate_event_key",
              "header_mismatch": "handoff_header_contract_mismatch",
              "receipt_failure": "handoff_import_system_failure",
              "concurrent_execution": "handoff_concurrent_execution",
              "sheets_429": "sheets_http_429",
              "sheets_403": "sheets_http_403",
              "source_invalid": "life_handoff_invalid",
              "import_summary": "life_handoff_import",
              "schema_validation": "ValidationError",
              "database_failure": "database_import_failed",
          }
          lines = log.splitlines()
          counts = {name: sum(token in line for line in lines) for name, token in patterns.items()}
          for name, count in counts.items():
              print(f"importer_log_signature {name}={count}")
          print(f"importer_log_lines={len(lines)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              print(f"- log_lines={len(lines)} (last 72h, max 150 entries)", file=f)
              for name, count in counts.items():
                  print(f"- {name}={count}", file=f)
              print("- Individual event payloads, access tokens and raw traces deliberately excluded.", file=f)
          PY
          fi

      - name: Generate summary
        run: |
          python - <<'PY'
          import json, os
          
          def load(name):
              try:
                  return json.load(open(f"{os.environ['RUNNER_TEMP']}/{name}"))
              except:
                  return {}
          
          job = load("job.json")
          rev = load("revision.json")
          execs = load("executions.json") or []
          
          job_image = job.get("spec", {}).get("template", {}).get("spec", {}).get("template", {}).get("spec", {}).get("containers", [{}])[0].get("image", "")
          rev_image = rev.get("spec", {}).get("containers", [{}])[0].get("image", "")
          
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              print("## Life Importer Evidence (read only)", file=f)
              print(f"- Job image: {job_image[:80]}...", file=f)
              print(f"- Production image: {rev_image[:80]}...", file=f)
              print(f"- Images match: {job_image == rev_image}", file=f)
              print(f"- Recent executions: {len(execs)}", file=f)
              for e in execs[:5]:
                  name = e.get("metadata", {}).get("name", "").split("/")[-1]
                  status = e.get("status", {}).get("conditions", [{}])[0].get("status", "?")
                  print(f"  - {name}: {status}", file=f)
                  reasons = [str(c.get("reason") or c.get("type") or "unknown") for c in e.get("status", {}).get("conditions", []) if c.get("status") in (False, "False")]
                  print(f"importer_execution name={name} status={status} failed_tasks={e.get('status', {}).get('failedCount', 0)} retries={e.get('status', {}).get('retriedCount', 0)} reasons={';'.join(reasons)[:180]}")
          PY

      # Only a push to this evidence workflow triggers PostgreSQL inspection.
      # The existing Cloud Run Job definition is never updated; the execution
      # overrides args with Python -c and cannot invoke the normal importer.
      - name: Read-only parity of accepted Sheet business versions in live PostgreSQL
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe life-assistant-api --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/curated-live.json"
          REV="$(jq -er '[.status.traffic[] | select((.percent//0)>0)] |
            if length==1 and .[0].percent==100 then .[0].revisionName else error("not sole live revision") end' "$RUNNER_TEMP/curated-live.json")"
          gcloud run revisions describe "$REV" --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/curated-revision.json"
          IMAGE="$(python - "$RUNNER_TEMP/curated-revision.json" <<'PY'
          import json,sys
          sys.path.insert(0,'.github/scripts')
          from v3_image_identity import canonical
          print(canonical(json.load(open(sys.argv[1]))['spec']['containers'][0]['image']))
          PY
          )"
          python .github/scripts/v3_curated_handoff_alignment.py --mode live \
            --json "$RUNNER_TEMP/curated-live.json" --revision-json "$RUNNER_TEMP/curated-revision.json" \
            --expected-revision "$REV" --expected-image "$IMAGE"
          gcloud run jobs describe "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/curated-job.json"
          python .github/scripts/v3_curated_handoff_alignment.py --mode job \
            --json "$RUNNER_TEMP/curated-job.json" --expected-image "$IMAGE"

          CODE="$(base64 -w0 <<'PY'
          import asyncio
          from sqlalchemy import text
          from app.db.session import engine
          from scripts.import_curated_from_sheet import SheetClient, parse_rows

          async def run():
              rows = parse_rows(await SheetClient().read())
              acked = [r for r in rows if r['handoff_status'] == 'ACKED']
              if len(acked) < 65 or any(not r['life_ack_at_tpe'] or r['life_import_result'] not in ('CREATED','UPDATED','UNCHANGED') for r in acked):
                  raise RuntimeError('receipt_not_complete')
              async with engine.connect() as conn:
                  await conn.execute(text('SET TRANSACTION READ ONLY'))
                  await conn.execute(text("SET LOCAL statement_timeout = '20s'"))
                  results = (await conn.execute(text(
                      'SELECT handoff_event_key, content_hash, handoff_details FROM curated_activities WHERE handoff_event_key = ANY(:keys)'
                  ), {'keys': [r['event_key'] for r in acked]})).mappings().all()
              pg = {r['handoff_event_key']: r for r in results}
              if len(pg) != len(acked):
                  raise RuntimeError('db_missing_handoff_rows')
              pending = 0
              for sheet in acked:
                  row = pg[sheet['event_key']]
                  expected_status = sheet['verification_status'] or 'unknown'
                  if row['content_hash'] != sheet['content_hash']:
                      raise RuntimeError('db_content_hash_mismatch')
                  if (row['handoff_details'] or {}).get('verification_status','unknown') != expected_status:
                      raise RuntimeError('db_verification_status_mismatch')
                  pending += expected_status == 'pending_review'
              if pending < 4:
                  raise RuntimeError('missing_pending_review_rows')
              print(f'curated_pg_sheet_parity=PASS acked={len(acked)} pending_review={pending} read_only=true', flush=True)
              await engine.dispose()

          asyncio.run(run())
          PY
          )"
          # Base64 only transports static visible Python code through the gcloud
          # comma-separated --args parser. No user content or credentials.
          BEFORE="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --limit 1 --format='value(metadata.name)')"
          gcloud run jobs execute "$JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --args="-c,import base64;exec(base64.b64decode('$CODE'))" --wait --quiet \
            --format=json > "$RUNNER_TEMP/curated-db-readback.json"
          AFTER="$(gcloud run jobs executions list --job "$JOB" --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --limit 1 --format='value(metadata.name)')"
          test -n "$AFTER"
          test "$BEFORE" != "$AFTER"
          gcloud run jobs executions describe "$AFTER" --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/curated-db-readback-execution.json"
          python - "$RUNNER_TEMP/curated-db-readback-execution.json" <<'PY'
          import json,sys
          status=json.load(open(sys.argv[1]))['status']
          if int(status.get('failedCount') or 0)>0 or not any(
              c.get('type')=='Completed' and c.get('status') in ('True',True)
              for c in status.get('conditions',[])
          ):
              raise SystemExit('read_only_db_parity_failed')
          PY
          echo "curated_pg_sheet_parity=PASS read_only=true execution=$AFTER" >> "$GITHUB_STEP_SUMMARY"
