# Safe, read-only runtime evidence. Never executes the importer or mutates Sheet/DB.
name: Life 01-03 existing importer evidence (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/life-01-03-runtime-evidence.yml

permissions:
  contents: read
  id-token: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB: life-assistant-free-events
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read existing Cloud Run importer executions without launching a new one
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs describe "$JOB" --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/job.json"
          # Read only: prove which immutable digest the production API and
          # importer Job currently use. A staging-only release never pins this
          # production Job, so do not infer that it contains new main code.
          if gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/service.json" 2>"$RUNNER_TEMP/service.err"; then
            LIVE_REV="$(python3 - "$RUNNER_TEMP/service.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          live=[x for x in j.get("status",{}).get("traffic",[])
                if int(x.get("percent") or 0)==100]
          if len(live)!=1: sys.exit(2)
          print(live[0].get("revisionName",""))
          PY
          )" || LIVE_REV=""
            if [[ -n "$LIVE_REV" ]]; then
              gcloud run revisions describe "$LIVE_REV" \
                --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
                --format=json > "$RUNNER_TEMP/live-revision.json" \
                2>"$RUNNER_TEMP/live-revision.err" || true
            fi
          fi
          python3 - "$RUNNER_TEMP/job.json" "$RUNNER_TEMP/live-revision.json" <<'PY'
          import json,os,sys
          sys.path.insert(0,".github/scripts")
          from v3_image_identity import canonical
          from v3_curated_handoff_alignment import validate_job
          summary=os.environ["GITHUB_STEP_SUMMARY"]
          result="NOT_VERIFIED"
          contract="NOT_VERIFIED"
          try:
              with open(sys.argv[1],encoding="utf-8") as f: job=json.load(f)
              with open(sys.argv[2],encoding="utf-8") as f: rev=json.load(f)
              live=canonical(rev.get("status",{}).get("imageDigest"))
              job_image=canonical(job["spec"]["template"]["spec"]["template"]["spec"]["containers"][0]["image"])
              result="PASS" if job_image==live else "MISMATCH"
              try:
                  validate_job(job,job_image)
                  contract="PASS"
              except (KeyError,ValueError,TypeError):
                  contract="FAIL"
          except (ValueError,KeyError,TypeError,FileNotFoundError,IndexError):
              pass
          with open(summary,"a") as f:
              print(f"- importer_job_image_vs_100pct_production={result}",file=f)
              print(f"- importer_job_command_sheet_contract={contract}",file=f)
              print("- latest_main_import_lock_deployed=NOT_VERIFIED unless its immutable release digest was promoted",file=f)
          print(f"importer_image_alignment={result} contract={contract}")
          PY
          if ! gcloud run jobs executions list --job "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/executions.json" 2>"$RUNNER_TEMP/executions.err"; then
            echo "existing_execution_readback=NOT_VERIFIED (list permission or API unavailable)" >> "$GITHUB_STEP_SUMMARY"
            printf '%s' '[]' > "$RUNNER_TEMP/executions.json"
          fi
          if ! gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="life-assistant-free-events" AND timestamp>="2026-10-12T00:00:00Z"' \
            --project "$GCP_PROJECT_ID" --limit 200 --format=json \
            > "$RUNNER_TEMP/logs.json" 2>"$RUNNER_TEMP/logs.err"; then
            echo "existing_execution_log_readback=NOT_VERIFIED (logs permission unavailable)" >> "$GITHUB_STEP_SUMMARY"
            printf '%s' '[]' > "$RUNNER_TEMP/logs.json"
          fi
          python3 - "$RUNNER_TEMP/executions.json" "$RUNNER_TEMP/logs.json" <<'PY'
          import json,re,sys,os
          def load(path):
              try:
                  data=json.load(open(path))
                  return data if isinstance(data,list) else []
              except (ValueError,OSError):
                  return []
          jobs=load(sys.argv[1])
          logs=load(sys.argv[2])
          # No source row fields, tokens, exception traces, or email addresses.
          names=[]
          for j in jobs[:10]:
              name=str(j.get("metadata",{}).get("name") or j.get("name") or "").split("/")[-1]
              status=j.get("status",{})
              conditions=status.get("conditions") or j.get("conditions") or []
              done=next((c for c in conditions if c.get("type") in ("Completed","Ready")), {})
              state=done.get("status", "UNKNOWN")
              names.append((name,str(state),str(status.get("completionTime") or j.get("completionTime") or "")))
          receipts=[]
          fields=("status","data_status","created","updated","unchanged","invalid","import_failed","ack_failed")
          for row in logs:
              msg=str(row.get("textPayload") or (row.get("jsonPayload") or {}).get("message") or "")
              if "life_handoff_import " not in msg:
                  continue
              vals=dict(re.findall(r"\b(status|data_status|created|updated|unchanged|invalid|import_failed|ack_failed)=([A-Z_]+|\d+)",msg))
              receipts.append({"timestamp":row.get("timestamp",""),
                  **{name:vals.get(name,"UNKNOWN") for name in fields}})
          summary=os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary,"a") as out:
              print("## Existing importer (read only; no new execution)",file=out)
              print(f"- execution_inventory_count: {len(jobs)}",file=out)
              for name,state,ended in names:
                  print(f"- execution: {name} completed_condition={state} completion={ended}",file=out)
              print(f"- historical_import_summaries_read: {len(receipts)}",file=out)
              for info in receipts[:8]:
                  print("- importer: "+" ".join(f"{k}={v}" for k,v in info.items()),file=out)
              print("- GAS_07_30_actual_trigger: NOT_VERIFIED (Apps Script triggers/logs are external to Cloud Run)",file=out)
              print("- Sheet_ack_and_PostgreSQL_same_execution_readback: NOT_VERIFIED by this read-only inventory",file=out)
          # The first 07:30 TPE window after the production 6fdb4cf release.
          # A matching Cloud Run Execution plus a matching Sheet receipt is
          # evidence of the daily import, not proof of the Apps Script trigger ID.
          tpe_window_start="2026-10-15T23:00:00Z"
          in_window=[j for j in jobs
              if str(j.get("status",{}).get("completionTime") or
                     j.get("completionTime") or "") >= tpe_window_start]
          completed=sum(any(c.get("type")=="Completed" and
                            str(c.get("status")).lower()=="true"
                            for c in (j.get("status",{}).get("conditions") or
                                      j.get("conditions") or []))
                        for j in in_window)
          print(f"importer_oct16_window executions={len(in_window)} completed={completed}")
          with open(summary,"a") as out:
              print(f"- oct16_0700_tpe_after_promotion_execution_count: {len(in_window)}",file=out)
              print(f"- oct16_0700_tpe_after_promotion_completed: {completed}",file=out)
              print("- Apps_Script_trigger_id: NOT_VERIFIED (not readable via Cloud Run API)",file=out)
          if not in_window or completed==0:
              raise SystemExit("no_successful_execution_in_first_postpromotion_window")
          print("importer_evidence=READ_ONLY execution_count=%s summaries=%s" %(len(jobs),len(receipts)))
          # Print only sanitized execution identity/time/condition in Actions logs
          # so this audit can be verified without reading summary artifacts.
          for name,state,ended in names:
              print("importer_execution name=%s condition=%s completed=%s" %(name,state,ended))
          for info in receipts[:8]:
              print("importer_aggregate "+ " ".join(f"{k}={v}" for k,v in info.items()))
          PY

      - name: Verify 2026-10-16 ACKED business versions against PostgreSQL (read only)
        shell: bash
        env:
          CORE_ACCEPTANCE_JOB: life-assistant-core-acceptance
        run: |
          set -euo pipefail
          # This executes an existing acceptance Job only, NEVER the importer.
          # The snapshot has five new Sheet ACKED=CREATED rows all stamped
          # 2026-10-16 07:34:15 TPE. No DB mutation or Sheet writing.
          SCRIPT="$(cat <<'PY'
          import asyncio
          from datetime import datetime
          from sqlalchemy import select
          from app.db.session import SessionLocal, engine
          from app.models.curated import CuratedActivity

          EXPECTED = {
              "songshanculturalpark.org:2026:100spotlights-meetup-1029": "9492110ee534043e65875a22a30e64199f7620ed6428e4d03252a224c60180b1",
              "hualien.gov.tw:20261025-26:food-farm-halfday-16": "021f1c1b62fa69b758dd24a3db909b86bae83aeab6e6a01d0b3ad478828e1ae6",
              "twtainan.net:2026:cloudinvoice-comedy-1107": "8c3c36c01e68b716630a491b948624b6fdc740684821d14205ed567c0b06548d",
              "hualien.travel:20261017:hotspring-opening-bag-100": "ec1ccc0ad6753ab34d313db954b6284eb6302735b2c5a1808c7442cc11e0e15c",
              "khh.travel:2026:wildwild-outdoor-1107": "8c23eb6997d4ec38eb100a28c25457c47fe280b10f36d1b7551fad2673ac6212",
          }
          START = datetime.fromisoformat("2026-10-16T06:06:00+08:00")
          END = datetime.fromisoformat("2026-10-16T07:34:15.797234+08:00")

          async def check():
              try:
                  async with SessionLocal() as db:
                      rows = (await db.execute(select(CuratedActivity).where(
                          CuratedActivity.handoff_event_key.in_(list(EXPECTED))
                      ))).scalars().all()
                      found = {row.handoff_event_key: row for row in rows}
                      if len(found) != len(EXPECTED):
                          raise SystemExit(41)
                      for key, version in EXPECTED.items():
                          row = found[key]
                          details = row.handoff_details
                          if (row.content_hash != version or not isinstance(details, dict)
                              or details.get("event_key") != key
                              or details.get("handoff_updated_at_tpe") != "2026-10-16T06:06:00+08:00"):
                              raise SystemExit(42)
                          if (row.created_at is None or not START <= row.created_at <= END):
                              raise SystemExit(43)
                  print("life_oct16_handoff_pg_readback=PASS acked_versions=5 created_in_window=5", flush=True)
              finally:
                  await engine.dispose()

          asyncio.run(check())
          PY
          )"
          [[ "$SCRIPT" != *"~"* ]]
          .github/scripts/run_cloud_run_job_with_diagnostics.sh "$CORE_ACCEPTANCE_JOB" \
            gcloud run jobs execute "$CORE_ACCEPTANCE_JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --args="^~^-c~$SCRIPT" --tasks=1 --task-timeout=3m --wait --quiet
          echo "life_oct16_handoff_pg_readback=PASS exact_new_ack_versions=5" >> "$GITHUB_STEP_SUMMARY"
