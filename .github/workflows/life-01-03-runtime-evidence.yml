name: Life Importer Evidence (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/life-01-03-runtime-evidence.yml

permissions:
  contents: read
  id-token: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB: life-assistant-free-events
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Read importer metadata
        run: |
          # Get job info
          gcloud run jobs describe "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/job.json"
          
          # Get production revision
          LIVE_REV="$(gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='json(status.traffic)' | jq -r '[.status.traffic[] | select(.percent==100)][0].revisionName // empty')"
          
          if [ -n "$LIVE_REV" ]; then
            gcloud run revisions describe "$LIVE_REV" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
              > "$RUNNER_TEMP/revision.json"
          fi
          
          # Get recent executions
          gcloud run jobs executions list --job "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --limit 10 --format=json > "$RUNNER_TEMP/executions.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/executions.json"

      - name: Read recent importer error signatures (read only)
        shell: bash
        run: |
          set -uo pipefail
          echo "## Recent Cloud Run importer logs (read only)" >> "$GITHUB_STEP_SUMMARY"
          # Never invoke the Job or display the raw payload. Only log stable,
          # redacted error categories and sanitized return codes.
          if ! gcloud logging read \
              'resource.type="cloud_run_job" AND resource.labels.job_name="life-assistant-free-events"' \
              --project "$GCP_PROJECT_ID" --freshness=72h --limit=150 \
              --format='value(textPayload)' > "$RUNNER_TEMP/importer-logs.txt" 2>"$RUNNER_TEMP/importer-log-error.txt"; then
            echo "- logging_read=NOT_VERIFIED (permission or API failure)" >> "$GITHUB_STEP_SUMMARY"
          else
            python - <<'PY'
          import collections, os
          from pathlib import Path

          log = Path(os.environ["RUNNER_TEMP"] + "/importer-logs.txt").read_text(errors="replace")
          patterns = {
              "invalid_handoff_record": "invalid_handoff_record",
              "duplicate_event_key": "missing_or_duplicate_event_key",
              "header_mismatch": "handoff_header_contract_mismatch",
              "receipt_failure": "handoff_import_system_failure",
              "concurrent_execution": "handoff_concurrent_execution",
              "sheets_429": "sheets_http_429",
              "sheets_403": "sheets_http_403",
              "source_invalid": "life_handoff_invalid",
              "import_summary": "life_handoff_import",
              "schema_validation": "ValidationError",
              "database_failure": "database_import_failed",
          }
          lines = log.splitlines()
          counts = {name: sum(token in line for line in lines) for name, token in patterns.items()}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              print(f"- log_lines={len(lines)} (last 72h, max 150 entries)", file=f)
              for name, count in counts.items():
                  print(f"- {name}={count}", file=f)
              print("- Individual event payloads, access tokens and raw traces deliberately excluded.", file=f)
          PY
          fi

      - name: Generate summary
        run: |
          python - <<'PY'
          import json, os
          
          def load(name):
              try:
                  return json.load(open(f"{os.environ['RUNNER_TEMP']}/{name}"))
              except:
                  return {}
          
          job = load("job.json")
          rev = load("revision.json")
          execs = load("executions.json") or []
          
          job_image = job.get("spec", {}).get("template", {}).get("spec", {}).get("template", {}).get("spec", {}).get("containers", [{}])[0].get("image", "")
          rev_image = rev.get("spec", {}).get("containers", [{}])[0].get("image", "")
          
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              print("## Life Importer Evidence (read only)", file=f)
              print(f"- Job image: {job_image[:80]}...", file=f)
              print(f"- Production image: {rev_image[:80]}...", file=f)
              print(f"- Images match: {job_image == rev_image}", file=f)
              print(f"- Recent executions: {len(execs)}", file=f)
              for e in execs[:5]:
                  name = e.get("metadata", {}).get("name", "").split("/")[-1]
                  status = e.get("status", {}).get("conditions", [{}])[0].get("status", "?")
                  print(f"  - {name}: {status}", file=f)
          PY
