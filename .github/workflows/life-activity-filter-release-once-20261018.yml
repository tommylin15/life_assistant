# One-shot, immutable bridge for the activity discovery quick-filter UI,
# requested after the exact UI test commit passed. No generic auto-production.
# V3 Release performs candidate build, CI gates, staging, live, rollback and Hosting.
name: Life Activity Filter One-Time Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: life-activity-filter-release-once-20261018
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      APPROVED_PARENT: a98755f1149e562decefed1e35e3d042bf9fb7dc
      TESTED_UI_SHA: babb49c723cebb9a6666fdb2e31920e0dc528c41
    steps:
      - name: Gate exact main ancestry and four independent CI jobs
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo "dispatch=false" >> "$GITHUB_OUTPUT"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$CURRENT" != "$RELEASE_SHA" ]]; then
            echo "activity_ui_prod=SKIP superseded_sha=$RELEASE_SHA main=$CURRENT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only the direct child of the reviewed documentation baseline may
          # dispatch production, with exactly these two auditable CI files.
          COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA?per_page=100")"
          jq -e --arg parent "$APPROVED_PARENT" '
            (.parents | length)==1 and .parents[0].sha==$parent and
            ([.files[].filename] | sort) ==
              ([".github/workflows/v3-auto-staging-after-ci.yml",
                ".github/workflows/life-activity-filter-release-once-20261018.yml"] | sort)
          ' <<< "$COMMIT" >/dev/null || {
            echo "activity_ui_prod=SKIP unauthorized_commit_shape" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # The parent must be the docs-only direct child of the tested UI SHA.
          PARENT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$APPROVED_PARENT?per_page=100")"
          jq -e --arg tested "$TESTED_UI_SHA" '
            (.parents | length)==1 and .parents[0].sha==$tested and
            (.files | length)>0 and all(.files[]; .filename|startswith("doc/"))
          ' <<< "$PARENT" >/dev/null

          CI="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" '
            .status=="completed" and .conclusion=="success" and
            .head_sha==$sha and .head_branch=="main" and
            .head_repository.full_name==$repo and .event=="push"
          ' <<< "$CI" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" |
            jq -e '
              [.jobs[] | select(.conclusion=="success") | .name] |
              unique | (index("flutter")!=null and index("backend")!=null and
                index("deployment-scripts")!=null and index("free-events-postgres")!=null)
            ' >/dev/null

          RELEASES="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v3-release-ghcr.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$RELEASE_SHA" 'any(.workflow_runs[]; .head_sha==$sha)' <<< "$RELEASES" >/dev/null; then
            echo "activity_ui_prod=SKIP existing_release_for_sha=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "activity_ui_prod=READY sha=$RELEASE_SHA ui_test_commit=$TESTED_UI_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Run existing staged V3 release and gated production promotion
        if: ${{ steps.gate.outputs.dispatch == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$RELEASE_SHA"
          gh workflow run v3-release-ghcr.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --raw-field promote=true --raw-field publish_staging=true
          echo "activity_ui_prod=DISPATCHED sha=$RELEASE_SHA promote=true publish_staging=true" >> "$GITHUB_STEP_SUMMARY"
          echo "State remains NOT VERIFIED until V3 stages and Hosting runtime readback PASS." >> "$GITHUB_STEP_SUMMARY"
