# User-authorized ONE-TIME 2026-10-16 production release continuation.
# Does not grant generic auto-production release. Locked to the immediate
# child of a specific docs-only, human-accepted staging baseline.
# Existing V3 workflow performs all runtime gates, staging pinning, promotion
# and rollback. Existing production Hosting auto-dispatch verifies live gates.
name: Life Approved One-Time Production Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: life-approved-one-time-production-20261016
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      BASE_SHA: ca93125e5e49caa7d4a2a79cf5dc2cb02fafce91
      DOCUMENTATION_SHA: a1d4850721afde10aa77acd898a7761dfc7cf89f
      ACCEPTED_STAGING_SHA: 2cfe1c9f1e4946bc2849a863f9891419f0db1c45
    steps:
      - name: Strictly verify one-time approved commit, same-source CI and human-accepted stage
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo 'dispatch=false' >> "$GITHUB_OUTPUT"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$MAIN_SHA" != "$RELEASE_SHA" ]]; then
            echo 'approved_prod=SKIP stale_sha' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA?per_page=100")"
          jq -e --arg parent "$BASE_SHA" '
            (.parents | length)==1 and .parents[0].sha==$parent and
            ([.files[].filename] | sort) ==
              ([".github/workflows/life-approved-production-once-20261016.yml", "backend/tests/test_cloud_build_v2.py"] | sort)
          ' <<< "$COMMIT" >/dev/null || {
            echo 'approved_prod=SKIP not_unique_approved_commit' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # Exact ancestry: approved Staging -> docs-only acceptance -> one-time dispatch bridge.
          BASE_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_SHA?per_page=100")"
          jq -e --arg parent "$DOCUMENTATION_SHA" '
            .parents[0].sha==$parent and
            ([.files[].filename] | sort) ==
              ([".github/workflows/life-approved-production-once-20261016.yml", ".github/workflows/v3-auto-staging-after-ci.yml"] | sort)
          ' <<< "$BASE_COMMIT" >/dev/null
          DOC_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DOCUMENTATION_SHA?per_page=100")"
          jq -e --arg sha "$ACCEPTED_STAGING_SHA" '
            .parents[0].sha==$sha and
            (.files|length)==3 and all(.files[]; .filename|startswith("doc/"))
          ' <<< "$DOC_COMMIT" >/dev/null
          CI="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          jq -e --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .status=="completed" and .conclusion=="success" and
            .head_sha==$sha and .head_branch=="main" and
            .head_repository.full_name==$repo and .event=="push"
          ' <<< "$CI" >/dev/null
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")"
          jq -e '
            [.jobs[] | select(.conclusion=="success") | .name] |
            unique | (index("backend")!=null and index("flutter")!=null and
              index("deployment-scripts")!=null and index("free-events-postgres")!=null)
          ' <<< "$JOBS" >/dev/null
          STAGE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/38886894486")"
          jq -e --arg sha "$ACCEPTED_STAGING_SHA" '
            .head_sha==$sha and .status=="completed" and
            .conclusion=="success" and .event=="workflow_dispatch"
          ' <<< "$STAGE" >/dev/null
          # No duplicate for this source SHA (including failed or queued).
          RELEASES="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v3-release-ghcr.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$RELEASE_SHA" 'any(.workflow_runs[]; .head_sha==$sha)' <<< "$RELEASES" >/dev/null; then
            echo 'approved_prod=SKIP already_dispatched' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          echo "approved_prod=READY sha=$RELEASE_SHA original_staging=$ACCEPTED_STAGING_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Run existing V3 staging readback then explicit production promotion
        if: steps.gate.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$RELEASE_SHA"
          gh workflow run v3-release-ghcr.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --raw-field promote=true --raw-field publish_staging=true
          echo "approved_prod=DISPATCHED sha=$RELEASE_SHA promote=true publish_staging=true" >> "$GITHUB_STEP_SUMMARY"
          echo 'Not a release PASS: await V3 live, rollback, exact-SHA Hosting and runtime gates.' >> "$GITHUB_STEP_SUMMARY"
