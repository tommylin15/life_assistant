name: Life Cloud Run Retirement Inventory (read only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Read inventory
        run: |
          python .github/scripts/life_cloud_run_retirement_inventory.py \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            | tee "$RUNNER_TEMP/retirement.json"
          
          python - "$RUNNER_TEMP/retirement.json" <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              print("## Life Cloud Run Retirement (read only)", file=f)
              print(f"- Services: {d.get('life_services', '?')}", file=f)
              print(f"- Jobs: {d.get('life_jobs', '?')}", file=f)
              print(f"- Revisions: {d.get('revision_count', '?')} (tagged: {d.get('tagged_revision_count', '?')})", file=f)
              print(f"- Live: {d.get('live_revisions', '?')}", file=f)
              print(f"- Newest 10: {d.get('newest_10', [])}", file=f)
              print("\nNo deletions performed.", file=f)
          PY
