name: Life Gemini Signed Smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Verified staging V3 release SHA"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: life-assistant-v3-production-release
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB: life-assistant-core-acceptance
      SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify source SHA
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Get Gateway URL
        id: gateway
        run: |
          URL="$(gcloud run services describe omniagent-agent-gateway \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run Gemini smoke test
        run: |
          gcloud run jobs execute "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --args="-m,scripts.run_shared_gemini_gateway_acceptance,${{ steps.gateway.outputs.url }}" \
            --task-timeout=4m --wait --quiet
          
          echo "gemini_smoke=PASS" >> "$GITHUB_STEP_SUMMARY"
