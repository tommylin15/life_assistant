# Does not modify any Cloud Run service/Job image/env, routing, IAM or Hosting.
name: Life Gemini P0-V Signed Candidate Smoke
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Verified staging-only V3 release commit SHA"
        required: true
        type: string
      source_run:
        description: "Verified staging-only V3 release workflow run ID"
        required: true
        type: string
  # One-time self-start for the already-verified 20e709a9 staging release.
  # Later pushes cannot pass the exact parent-SHA gate. Subsequent releases
  # explicitly dispatch this workflow from their own successful V3 run.
  push:
    branches: [main]
    paths: [.github/workflows/life-gemini-p0v-signed-smoke.yml]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: life-assistant-v3-production-release
  cancel-in-progress: false
jobs:
  signed-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev-test
    env:
      PROJECT: gen-lang-client-0593591102
      REGION: us-central1
      LIFE_SERVICE: life-assistant-api
      GATEWAY_SERVICE: omniagent-agent-gateway
      # V3 pins CORE on staging-only release; POSTDEPLOY is pinned only before production promotion.
      JOB: life-assistant-core-acceptance
      EXPECTED_SA: omniagent-codex-life-client@gen-lang-client-0593591102.iam.gserviceaccount.com
      SOURCE_SHA: ${{ inputs.source_sha || '20e709a9d151691390f449cea4e5a8be839ef503' }}
      SOURCE_RUN: ${{ inputs.source_run || '38363418508' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Exact SHA and successful staging-only release source
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo "run=false" >> "$GITHUB_OUTPUT"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_sha="$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$current_sha"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Run once against the last verified V3 candidate; a later workflow
            # edit cannot silently replay that old run.
            if [[ "$(git rev-parse HEAD^)" != "09e237e8733648f4e7937d058135a52e9c7ba3a7" || "$SOURCE_SHA" != "20e709a9d151691390f449cea4e5a8be839ef503" ]]; then
              echo "gemini_smoke=SKIP bootstrap_source_mismatch" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            test "$current_sha" = "$SOURCE_SHA"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .name=="V3 Release - GHCR to Cloud Run" and
              .head_sha==$sha and .head_branch=="main" and
              .event=="workflow_dispatch" and .conclusion=="success"
            ' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            > "$RUNNER_TEMP/source-jobs.json"
          jq -e '
            [.jobs[] | select(.name=="release") | .steps[] |
             select(.name=="Promote exact Preview to independent fixed staging live and verify pinned routes"
                    or .name=="Require explicit promotion selection"
                    or .name=="Reconfirm source SHA and live traffic, then promote") |
             {name,conclusion}] |
             length==3 and
             any(.[]; .name=="Promote exact Preview to independent fixed staging live and verify pinned routes" and .conclusion=="success") and
             any(.[]; .name=="Require explicit promotion selection" and .conclusion=="success") and
             any(.[]; .name=="Reconfirm source SHA and live traffic, then promote" and .conclusion=="skipped")
          ' "$RUNNER_TEMP/source-jobs.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/check-runs?per_page=100" |
            jq -e '[.check_runs[] | select(.name=="flutter" or .name=="backend" or
                     .name=="deployment-scripts" or .name=="free-events-postgres") |
                     select(.conclusion=="success") | .name] | unique | length==4' >/dev/null
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "source_staging_only=PASS sha=$SOURCE_SHA run=$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
      - uses: google-github-actions/auth@v2
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ steps.gate.outputs.run == 'true' }}
      - name: Read-only identity, pinned image and zero traffic Gateway pilot
        if: ${{ steps.gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$LIFE_SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$RUNNER_TEMP/life-before.json"
          gcloud run services describe "$GATEWAY_SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$RUNNER_TEMP/gateway-before.json"
          gcloud run jobs describe "$JOB" --project "$PROJECT" --region "$REGION" --format=json > "$RUNNER_TEMP/job.json"
          rev="$(jq -r '.status.latestReadyRevisionName' "$RUNNER_TEMP/life-before.json")"
          gcloud run revisions describe "$rev" --project "$PROJECT" --region "$REGION" --format=json > "$RUNNER_TEMP/life-revision.json"
          python3 - "$RUNNER_TEMP" "$EXPECTED_SA" <<'PY'
          import json,sys,re,pathlib
          root=pathlib.Path(sys.argv[1])
          expected=sys.argv[2]
          read=lambda filename: json.loads((root/filename).read_text())
          life,gw,job,rev=(read(name) for name in ("life-before.json","gateway-before.json","job.json","life-revision.json"))
          life_sa=(((life.get("spec") or {}).get("template") or {}).get("spec") or {}).get("serviceAccountName")
          # Cloud Run Jobs v1: spec.template.spec.template.spec (TaskSpec).
          # The older lookup skipped the ExecutionTemplate's "spec" and
          # falsely reported None despite a configured runtime SA.
          execution_spec=(((job.get("spec") or {}).get("template") or {}).get("spec") or {})
          job_spec=((execution_spec.get("template") or {}).get("spec") or {})
          if not job_spec:
              job_spec=((job.get("template") or {}).get("template") or {})
          job_sa=job_spec.get("serviceAccountName")
          print("life_api_runtime_sa="+str(life_sa))
          print("life_postdeploy_job_sa="+str(job_sa))
          print("life_dedicated_caller_sa="+expected)
          if life_sa!=expected:
              print("life_api_identity=NOT_VERIFIED dedicated SA mismatch")
          if job_sa!=expected:
              print("life_job_identity=NOT_VERIFIED dedicated SA mismatch")
          if life_sa!=expected or job_sa!=expected:
              raise SystemExit("NOT VERIFIED: verified identity mismatch; no model call attempted")
          image=((rev.get("spec") or {}).get("containers") or [{}])[0].get("image","")
          job_image=(job_spec.get("containers") or [{}])[0].get("image","")
          canonical=lambda item:item.removeprefix("cache.us-docker.pkg.dev/")
          print("life_api_image_ref="+str(canonical(image)))
          print("life_acceptance_job_image_ref="+str(canonical(job_image)))
          if canonical(image)!=canonical(job_image) or not re.fullmatch(r"ghcr[.]io/tommylin15/life_assistant-backend@sha256:[a-f0-9]{64}",canonical(image)):
              raise SystemExit("NOT VERIFIED: source and consumer Job image not the same immutable GHCR digest")
          tags=[t for t in (gw.get("status") or {}).get("traffic") or []
                if t.get("tag")=="gemini-p0v-b03e5f55" and t.get("percent",0)==0]
          if len(tags)!=1 or not re.fullmatch(r"https://gemini-p0v-b03e5f55---omniagent-agent-gateway-[a-z0-9-]+[.]a[.]run[.]app",tags[0].get("url","")):
              raise SystemExit("NOT VERIFIED: approved zero-traffic Gateway pilot not found")
          (root/"gateway-url").write_text(tags[0]["url"])
          print("life_runtime_identity=PASS immutable_image=PASS gateway_pilot_zero_traffic=PASS")
          PY
      - name: One real Life runtime signed Gemini Flash-Lite call
        if: ${{ steps.gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat "$RUNNER_TEMP/gateway-url")"
          gcloud run jobs execute "$JOB" --project "$PROJECT" --region "$REGION" \
            --args="-m,scripts.run_shared_gemini_gateway_acceptance,$url" \
            --task-timeout=4m --wait --quiet
          echo "life_runtime_to_gateway_to_gemini=PASS (synthetic text; authenticated user API NOT VERIFIED)" >> "$GITHUB_STEP_SUMMARY"
      - name: Compare untouched production serving traffic
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$LIFE_SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$RUNNER_TEMP/life-after.json"
          gcloud run services describe "$GATEWAY_SERVICE" --project "$PROJECT" --region "$REGION" --format=json > "$RUNNER_TEMP/gateway-after.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json,sys,pathlib
          root=pathlib.Path(sys.argv[1])
          def serving(name):
              service=json.loads((root/name).read_text())
              return sorted((t.get("revisionName"),t.get("percent")) for t in
                            (service.get("status") or {}).get("traffic") or [] if t.get("percent",0)>0)
          if serving("life-before.json")!=serving("life-after.json") or serving("gateway-before.json")!=serving("gateway-after.json"):
              raise SystemExit("FAIL: formal production traffic unexpectedly changed")
          print("production_traffic_unchanged=PASS")
          PY
