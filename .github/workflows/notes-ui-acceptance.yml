name: Notes UI Acceptance

on:
  workflow_dispatch:

concurrency:
  group: notes-ui-acceptance-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright

      - name: Validate acceptance scripts
        run: |
          node --check .github/scripts/verify_notes_ui_production.mjs
          node --check .github/scripts/verify_drive_ui_production.mjs
          node --check .github/scripts/diagnose_notes_route.mjs

      - name: Diagnose Notes route
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          curl --fail --silent --show-error \
            --dump-header /tmp/notes-route.headers \
            --output /tmp/notes-route.html \
            "$BASE_URL/more/notes?notes_route=$RELEASE_SHA"
          grep -Fq '<title>生活助理</title>' /tmp/notes-route.html
          BASE_URL="$BASE_URL" node .github/scripts/diagnose_notes_route.mjs

      - name: Verify release and run Notes/Drive UI acceptance
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          REMOTE_RELEASE="$(curl --fail --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "$BASE_URL/release.txt?web_acceptance=$RELEASE_SHA")"
          test "$REMOTE_RELEASE" = "$RELEASE_SHA"
          BASE_URL="$BASE_URL" node .github/scripts/verify_notes_ui_production.mjs
          BASE_URL="$BASE_URL" node .github/scripts/verify_drive_ui_production.mjs

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-acceptance-${{ github.sha }}
          path: |
            /tmp/notes-ui-acceptance.png
            /tmp/drive-ui-acceptance.png
          if-no-files-found: ignore
