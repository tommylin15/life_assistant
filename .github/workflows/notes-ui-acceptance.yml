name: Notes UI Acceptance

on:
  workflow_run:
    workflows: [Deploy Firebase Hosting]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notes-ui-acceptance-main-${{ github.event.workflow_run.conclusion || 'success' }}
  cancel-in-progress: false

jobs:
  accept:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate acceptance script syntax
        run: |
          node --check .github/scripts/verify_notes_ui_production.mjs
          node --check .github/scripts/verify_drive_ui_production.mjs
          node --check .github/scripts/diagnose_notes_route.mjs

      - name: Install production UI acceptance tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Diagnose deployed Notes route
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          curl --fail --silent --show-error \
            --dump-header /tmp/notes-route.headers \
            --output /tmp/notes-route.html \
            "$BASE_URL/more/notes?notes_route=$RELEASE_SHA"
          echo "notes_route_headers_begin"
          cat /tmp/notes-route.headers
          echo "notes_route_headers_end"
          grep -Fq '<title>生活助理</title>' /tmp/notes-route.html
          BASE_URL="$BASE_URL" node .github/scripts/diagnose_notes_route.mjs

      - name: Verify deployed release, Notes UI, and Drive UI
        run: |
          BASE_URL="https://${GCP_PROJECT_ID}.web.app"
          REMOTE_RELEASE="$(curl --fail --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "$BASE_URL/release.txt?web_acceptance=$RELEASE_SHA")"
          test "$REMOTE_RELEASE" = "$RELEASE_SHA"
          BASE_URL="$BASE_URL" node .github/scripts/verify_notes_ui_production.mjs
          BASE_URL="$BASE_URL" node .github/scripts/verify_drive_ui_production.mjs

      - name: Upload Web UI acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-production-acceptance-${{ env.RELEASE_SHA }}
          path: |
            /tmp/notes-ui-acceptance.png
            /tmp/drive-ui-acceptance.png
          if-no-files-found: ignore
