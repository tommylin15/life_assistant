name: Post-deploy Runtime Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: postdeploy-runtime-acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      JOB: life-assistant-postdeploy-acceptance
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Resolve current image
        id: image
        run: |
          REV="$(gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.latestReadyRevisionName)')"
          IMAGE="$(gcloud run revisions describe "$REV" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.containers[0].image)')"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update job image
        run: |
          gcloud run jobs update "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "${{ steps.image.outputs.ref }}" --quiet

      - uses: ./.github/actions/run-acceptance-job
        with:
          job_name: ${{ env.JOB }}
          module: scripts.run_notes_product_acceptance
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}

      - uses: ./.github/actions/run-acceptance-job
        with:
          job_name: ${{ env.JOB }}
          module: scripts.run_project_drive_runtime_acceptance
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          timeout: 5m

      - uses: ./.github/actions/run-acceptance-job
        with:
          job_name: ${{ env.JOB }}
          module: scripts.run_drive_ai_enrichment_acceptance
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          timeout: 5m
