# Only a fully promoted V3 production release may launch production Hosting.
# Successful staging-only V3 releases MUST NOT trigger this workflow.
name: V3 Auto Production Hosting After Promoted Release

on:
  workflow_run:
    workflows: ["V3 Release - GHCR to Cloud Run"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  checks: read
  actions: write

concurrency:
  group: life-assistant-auto-production-hosting-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch-hosting:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Prove same-SHA successful production gates and deduplicate Hosting
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo "dispatch=false" >> "$GITHUB_OUTPUT"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          jq -e --argjson id "$RELEASE_RUN_ID" \
                --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .id == $id and .head_sha == $sha and .head_branch == "main" and
            .head_repository.full_name == $repo and
            .name == "V3 Release - GHCR to Cloud Run" and
            .event == "workflow_dispatch" and
            .status == "completed" and .conclusion == "success"
          ' <<< "$RUN" >/dev/null
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$MAIN_SHA" != "$RELEASE_SHA" ]]; then
            echo "auto_production_hosting=SKIP stale_release=$RELEASE_SHA main=$MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A staging-only success never contains the mandatory *production*
          # steps below. Fail closed if ANY live/rollback acceptance is absent.
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100")"
          jq -e '
            [.jobs[] | select(.name == "release" and .conclusion == "success") |
              .steps[] | select(.conclusion == "success") | .name] as $passed |
            [
              "Promote exact Preview to independent fixed staging live and verify pinned routes",
              "Reconfirm source SHA and live traffic, then promote",
              "Post-promotion live health, PostgreSQL and access gates",
              "Controlled rollback rehearsal and restore promoted live traffic",
              "Retain latest 10 revisions after all live gates PASS",
              "Pin curated handoff Job after verified production promotion"
            ] | all(.[]; . as $name | ($passed | index($name)) != null)
          ' <<< "$JOBS" >/dev/null

          CHECKS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100")"
          jq -e '
            [.check_runs[] |
             select(.name == "flutter" or .name == "backend" or
                    .name == "deployment-scripts" or .name == "free-events-postgres") |
             select(.conclusion == "success") | .name] | unique | length == 4
          ' <<< "$CHECKS" >/dev/null

          # Prevent any repeated same-SHA Hosting deployment, even on manual
          # V3 reruns. Failed Hosting is investigated, not silently retried.
          HOSTING_RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-firebase-hosting.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$RELEASE_SHA" '
              any(.workflow_runs[]; .head_sha == $sha)
            ' <<< "$HOSTING_RUNS" >/dev/null; then
            echo "auto_production_hosting=SKIP existing_hosting_run_for_sha=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "auto_production_hosting=READY sha=$RELEASE_SHA release=$RELEASE_RUN_ID live_and_rollback=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch production Firebase Hosting only after full V3 promotion PASS
        if: ${{ steps.gate.outputs.dispatch == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$RELEASE_SHA"
          gh workflow run deploy-firebase-hosting.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "auto_production_hosting=DISPATCHED sha=$RELEASE_SHA source_release=$RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Dispatch is not production Hosting PASS; verify the subsequent Hosting run and live readback separately." >> "$GITHUB_STEP_SUMMARY"
