# Staging-only automatic continuation of the four-gate main CI.
# Never starts production traffic/Hosting promotion.
name: V3 Auto Staging After CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

# A re-run of the same source CI cannot dispatch concurrently with itself.
concurrency:
  group: life-assistant-auto-staging-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch-staging:
    # Exclude PR/manual CI and success from a fork or a non-main branch.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify successful same-SHA main CI and its four jobs
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo "dispatch=false" >> "$GITHUB_OUTPUT"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" |
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" '
              .status == "completed" and .conclusion == "success" and
              .head_sha == $sha and .head_branch == "main" and
              .event == "push" and .head_repository.full_name == $repo' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" |
            jq -e '
              [.jobs[] |
               select(.name == "flutter" or .name == "backend" or
                      .name == "deployment-scripts" or .name == "free-events-postgres") |
               select(.conclusion == "success") | .name] | unique | length == 4' > /dev/null

          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$MAIN_SHA" != "$RELEASE_SHA" ]]; then
            echo "auto_staging=SKIP stale_ci_sha=$RELEASE_SHA current_main=$MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Do not release a new Cloud Run revision for documentation-only
          # commits. Unrecognized paths fail closed to normal deployment.
          CHANGED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA?per_page=100")"
          jq -e '.files | type=="array" and length>0 and length<300' <<< "$CHANGED" >/dev/null
          if jq -e 'all(.files[]; (.filename | startswith("doc/")) or
                           (.filename=="README.md") or (.filename=="AGENTS.md") or
                           (.filename=="CHANGELOG.md"))' <<< "$CHANGED" >/dev/null; then
            echo "auto_staging=SKIP docs_only_ci_passed sha=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The narrowly pinned activity-filter UI production continuation
          # handles its own staged promotion. Avoid a second staging-only run.
          if jq -e 'any(.files[]; .filename==".github/workflows/life-activity-filter-release-once-20261018.yml")' <<< "$CHANGED" > /dev/null; then
            echo "auto_staging=SKIP activity_filter_one_shot_release" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Owner-approved 2026-10-16 single-purpose production bridge.
          # That bridge reruns staging and all live gates before promotion.
          # Do not dispatch a duplicate staging-only release for its commit.
          if jq -e 'any(.files[]; .filename==".github/workflows/life-approved-production-once-20261016.yml")' <<< "$CHANGED" > /dev/null; then
            echo "auto_staging=SKIP one_shot_approved_production_bridge" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 2026-10-18 user-requested one-shot importer compatibility release.
          # Its separate, exact-ancestry workflow dispatches the existing V3
          # promotion after the four CI jobs succeed; do not send staging twice.
          if jq -e 'any(.files[]; .filename==".github/workflows/life-curated-promotion-once-20261018.yml")' <<< "$CHANGED" > /dev/null; then
            echo "auto_staging=SKIP curated_one_shot_promotion_bridge" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # One-shot importer execution verifies the existing promoted image.
          if jq -e 'any(.files[]; .filename==".github/workflows/life-curated-import-once-20261018.yml")' <<< "$CHANGED" > /dev/null; then
            echo "auto_staging=SKIP one_shot_import_acceptance" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Single rerun after an audited malformed hash correction, not a release.
          if jq -e 'any(.files[]; .filename==".github/workflows/life-curated-hash-retry-once-20261018.yml")' <<< "$CHANGED" > /dev/null; then
            echo "auto_staging=SKIP one_shot_hash_repair_job" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if jq -e 'all(.files[]; .filename==".github/workflows/life-01-03-runtime-evidence.yml" or .filename==".github/workflows/v3-auto-staging-after-ci.yml" or .filename=="backend/tests/test_cloud_build_v2.py") and any(.files[]; .filename==".github/workflows/life-01-03-runtime-evidence.yml")' <<< "$CHANGED" > /dev/null; then
            echo "auto_staging=SKIP read_only_importer_pg_parity" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Approved 0.4.0 user release: its exact-SHA production bridge
          # runs full V3 staging itself; prevent a duplicate staging dispatch.
          if jq -e 'any(.files[]; .filename==".github/workflows/life-v040-production-once-20261021.yml")' <<< "$CHANGED" > /dev/null; then
            echo "auto_staging=SKIP life_v040_one_shot_production_owns_release" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Explicit one-time user-accepted Gmail UI production release.
          # Its own exact SHA/CI-gated bridge owns the staging + production run.
          if jq -e 'any(.files[]; .filename==".github/workflows/gmail-ui-production-once-20261020.yml")' <<< "$CHANGED" > /dev/null; then
            echo "auto_staging=SKIP gmail_ui_one_shot_production_owns_release" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # This approved Gmail ONNX staging-only continuation dispatches the
          # same V3 gates with enable_gmail_onnx=true. Never race a second
          # rules-only V3 release against the fixed staging Hosting site.
          if jq -e 'any(.files[]; .filename==".github/workflows/gmail-onnx-life-staging-once.yml")' <<< "$CHANGED" > /dev/null; then
            echo "auto_staging=SKIP onnx_full_life_staging_owns_release" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Do not start a second same-SHA release for CI re-runs, including
          # releases already dispatched manually. The V3 release has its own
          # immutable SHA guard and shared release concurrency lock.
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v3-release-ghcr.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$RELEASE_SHA" '
               any(.workflow_runs[]; .head_sha == $sha)' <<< "$RUNS" > /dev/null; then
            echo "auto_staging=SKIP existing_release_for_sha=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "auto_staging=READY sha=$RELEASE_SHA ci_run=$CI_RUN_ID four_jobs=PASS" >> "$GITHUB_STEP_SUMMARY"

      # A previously enabled LINE test environment must not be replaced by
      # this workflow's default enable_line=false release. No GCP privilege
      # expansion: inspect the fixed public staging LINE config, fail closed.
      - name: Checkout exact source for LINE staging protection
        if: ${{ steps.gate.outputs.dispatch == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Preserve LINE-enabled staging before auto dispatch
        id: line_staging
        if: ${{ steps.gate.outputs.dispatch == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/line_staging_guard.py --github-output "$GITHUB_OUTPUT" |
            tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$(sed -n 's/^protect=//p' "$GITHUB_OUTPUT" | tail -n 1)" == "true" ]]; then
            echo "auto_staging=SKIP existing_LINE_staging_or_unknown_status" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dispatch staging-only existing V3 release
        if: ${{ steps.gate.outputs.dispatch == 'true' && steps.line_staging.outputs.protect == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$RELEASE_SHA"
          gh workflow run v3-release-ghcr.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --raw-field promote=false \
            --raw-field publish_staging=true \
            --raw-field enable_line=false \
            --raw-field auto_staging=true
          echo "auto_staging=DISPATCHED sha=$RELEASE_SHA promote=false publish_staging=true" >> "$GITHUB_STEP_SUMMARY"
          echo "The V3 workflow independently checks exact source SHA, Preview, staging live," >> "$GITHUB_STEP_SUMMARY"
          echo "owner Google OAuth evidence and staging-only rollback; CI success is not deployment PASS." >> "$GITHUB_STEP_SUMMARY"
