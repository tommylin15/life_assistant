# Automatic release after CI passes on main branch.
# Triggers full release pipeline including production promotion.
name: V3 Auto Release After CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: life-assistant-auto-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch-release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify CI success and check for docs-only changes
        id: gate
        run: |
          set -euo pipefail
          echo "dispatch=false" >> "$GITHUB_OUTPUT"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          
          # Verify CI run
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" | \
            jq -e --arg sha "$RELEASE_SHA" '
              .status == "completed" and .conclusion == "success" and
              .head_sha == $sha and .head_branch == "main" and
              .event == "push"' > /dev/null
          
          # Verify all 4 CI jobs passed
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" | \
            jq -e '[.jobs[] | select(.name == "flutter" or .name == "backend" or .name == "deployment-scripts" or .name == "free-events-postgres") | select(.conclusion == "success") | .name] | unique | length == 4' > /dev/null
          
          # Check if main has moved
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$MAIN_SHA" != "$RELEASE_SHA" ]]; then
            echo "auto_release=SKIP stale_sha" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          
          # Skip docs-only commits
          CHANGED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA?per_page=100")"
          if jq -e 'all(.files[]; (.filename | startswith("doc/")) or (.filename | test("^(README|AGENTS|CHANGELOG)\\.md$")))' <<< "$CHANGED" >/dev/null 2>&1; then
            echo "auto_release=SKIP docs_only" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          
          # Check for existing release run
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v3-release-ghcr.yml/runs?branch=main&per_page=50")"
          if jq -e --arg sha "$RELEASE_SHA" 'any(.workflow_runs[]; .head_sha == $sha)' <<< "$RUNS" > /dev/null; then
            echo "auto_release=SKIP existing_run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          
          echo "dispatch=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch full auto-release
        if: steps.gate.outputs.dispatch == 'true'
        run: |
          gh workflow run v3-release-ghcr.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --raw-field auto_promote=true
          
          echo "## Auto Release Dispatched 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI Run: $CI_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auto Promote: true" >> "$GITHUB_STEP_SUMMARY"
