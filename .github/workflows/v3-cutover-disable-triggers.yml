name: V3 Cutover - disable legacy Cloud Build triggers

on:
  workflow_dispatch:
    inputs:
      verified_release_run_id:
        description: "Successful promoted V3 Release Actions run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: life-assistant-v3-production-release
  cancel-in-progress: false

jobs:
  disable-legacy:
    runs-on: ubuntu-latest
    environment: dev-test
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.verified_release_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Require actually successful promoted+retained V3 release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          echo "$RUN" | jq -e --arg wf "V3 Release - GHCR to Cloud Run" \
            '.name==$wf and .head_branch=="main" and
             .status=="completed" and .conclusion=="success"'
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100")"
          echo "$JOBS" | jq -e '
            [.jobs[].steps[] |
             select(.name=="Post-promotion live health, OAuth redirect, PostgreSQL and access gates"
             or .name=="Controlled rollback rehearsal and restore promoted live traffic"
             or .name=="Retain latest 10 revisions after all live gates PASS") |
             select(.conclusion=="success") | .name] | unique | length==3'
          VERIFIED_RELEASE_SHA="$(printf '%s' "$RUN" | jq -r '.head_sha')"
          [[ "$VERIFIED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "VERIFIED_RELEASE_SHA=$VERIFIED_RELEASE_SHA" >> "$GITHUB_ENV"
          echo "release_run_evidence=PASS run=$RELEASE_RUN_ID sha=$VERIFIED_RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Readback current serving image and readiness
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/v3-current-service.json"
          jq -e '[.status.traffic[] | select(.percent==100)] | length==1' \
            "$RUNNER_TEMP/v3-current-service.json"
          LIVE_REVISION="$(jq -r '.status.traffic[] | select(.percent==100) | .revisionName' \
            "$RUNNER_TEMP/v3-current-service.json")"
          [[ "$LIVE_REVISION" == life-assistant-api-* ]]
          EXPECTED_TAG="v3-$(printf '%s' "$VERIFIED_RELEASE_SHA" | cut -c1-10)"
          jq -e --arg rev "$LIVE_REVISION" --arg tag "$EXPECTED_TAG" \
            '[.status.traffic[] | select(.revisionName==$rev and .tag==$tag)] | length==1' \
            "$RUNNER_TEMP/v3-current-service.json"
          gcloud run revisions describe "$LIVE_REVISION" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/v3-current-revision.json"
          IMAGE="$(jq -r '.spec.containers[0].image // empty' \
            "$RUNNER_TEMP/v3-current-revision.json")"
          EXPECTED_IMAGE="$(python - "$IMAGE" <<'PY'
          import sys
          sys.path.insert(0, ".github/scripts")
          from v3_image_identity import canonical
          print(canonical(sys.argv[1]))
          PY
          )"
          python .github/scripts/v3_image_identity.py \
            --resource revision --json "$RUNNER_TEMP/v3-current-revision.json" \
            --expected "$EXPECTED_IMAGE"
          REV_COUNT="$(gcloud run revisions list --service life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(metadata.name)' | grep -c . || true)"
          [[ "$REV_COUNT" =~ ^[0-9]+$ ]]
          test "$REV_COUNT" -ge 1 && test "$REV_COUNT" -le 10
          curl --fail --silent --show-error \
            "https://gen-lang-client-0593591102.web.app/health" >/dev/null
          echo "serving_from_verified_release=PASS revision=$LIVE_REVISION retained=$REV_COUNT source=$EXPECTED_IMAGE" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Disable only two verified legacy life_assistant triggers
        shell: bash
        run: |
          set -euo pipefail
          # The ephemeral GitHub gcloud installation does not bundle beta.
          gcloud components install beta --quiet
          for ITEM in \
            "70ca60f2-8519-40c4-9422-5ac78f1b355f:life-assistant-v2-main" \
            "892a893e-173f-49b2-9055-d5a9adc21496:life-assistant-v2-release"; do
            ID="$(printf '%s' "$ITEM" | cut -d: -f1)"
            NAME="$(printf '%s' "$ITEM" | cut -d: -f2)"
            gcloud builds triggers describe "$ID" --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" --format=json \
              > "$RUNNER_TEMP/v3-trigger-$ID-before.json"
            jq -e --arg name "$NAME" --arg id "$ID" \
              '.name==$name and .id==$id' "$RUNNER_TEMP/v3-trigger-$ID-before.json"
            if jq -e '.disabled == true' "$RUNNER_TEMP/v3-trigger-$ID-before.json" >/dev/null; then
              echo "legacy_trigger_already_disabled=PASS name=$NAME id=$ID" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            umask 077
            ORIGINAL="$RUNNER_TEMP/v3-trigger-$ID-original.yaml"
            MODIFIED="$RUNNER_TEMP/v3-trigger-$ID-disabled.yaml"
            # Official Cloud Build export/import keeps the original trigger
            # configuration; only the top-level disabled field may change.
            gcloud beta builds triggers export "$ID" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --destination "$ORIGINAL" --quiet
            test -s "$ORIGINAL"
            if grep -Eq '^disabled:[[:space:]]*(true|false|True|False)[[:space:]]*$' "$ORIGINAL"; then
              sed -E 's/^disabled:[[:space:]]*(true|false|True|False)[[:space:]]*$/disabled: true/' \
                "$ORIGINAL" > "$MODIFIED"
            else
              cp "$ORIGINAL" "$MODIFIED"
              printf '\ndisabled: true\n' >> "$MODIFIED"
            fi
            test "$(grep -Ec '^disabled: true$' "$MODIFIED")" = 1
            # Fail closed if a change beyond disabled was introduced.
            sed '/^disabled:/d' "$ORIGINAL" | sed '/^[[:space:]]*$/d' \
              > "$RUNNER_TEMP/v3-trigger-$ID-original-normalized"
            sed '/^disabled:/d' "$MODIFIED" | sed '/^[[:space:]]*$/d' \
              > "$RUNNER_TEMP/v3-trigger-$ID-disabled-normalized"
            cmp -s "$RUNNER_TEMP/v3-trigger-$ID-original-normalized" \
              "$RUNNER_TEMP/v3-trigger-$ID-disabled-normalized"
            gcloud builds triggers import --source="$MODIFIED" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet
            gcloud builds triggers describe "$ID" --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" --format=json \
              | jq -e --arg name "$NAME" '.name==$name and .disabled==true'
            echo "legacy_trigger_disabled=PASS name=$NAME id=$ID" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "No trigger was deleted. GCS and AR objects were not modified." \
            >> "$GITHUB_STEP_SUMMARY"
