name: V3 GCP Inventory (read only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Run inventory scripts
        run: |
          # Main GCP inventory
          python .github/scripts/v3_gcp_inventory.py \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            | tee "$RUNNER_TEMP/inventory.json"
          
          # Scheduler status
          python .github/scripts/v3_free_event_retirement_readback.py \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            | tee "$RUNNER_TEMP/scheduler.json"
          
          # GCS inventory
          python .github/scripts/v3_gcs_object_inventory.py \
            --project "$GCP_PROJECT_ID" \
            | tee "$RUNNER_TEMP/gcs.json"
          
          # AR Docker inventory
          python .github/scripts/v3_ar_docker_inventory.py \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            | tee "$RUNNER_TEMP/ar.json"

      - name: Generate summary
        run: |
          python - <<'PY'
          import json, os
          
          def load(name):
              try:
                  return json.load(open(f"{os.environ['RUNNER_TEMP']}/{name}"))
              except:
                  return {}
          
          inv = load("inventory.json")
          sched = load("scheduler.json")
          gcs = load("gcs.json")
          ar = load("ar.json")
          
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              print("## V3 GCP Inventory (read only)", file=f)
              
              if "checks" in inv:
                  for name, val in inv["checks"].items():
                      print(f"- {name}: {val.get('status', '?')}", file=f)
              
              if "matching_scheduler_jobs" in sched:
                  print(f"- Scheduler jobs: {len(sched['matching_scheduler_jobs'])}", file=f)
              
              if "buckets" in gcs:
                  for b in gcs["buckets"]:
                      print(f"- GCS {b['bucket']}: {b.get('objects', '?')} objects", file=f)
              
              if "repositories" in ar:
                  for r in ar["repositories"]:
                      if r.get("format", "").upper() == "DOCKER":
                          print(f"- AR {r['repository']}: {r.get('docker_digest_count', '?')} digests", file=f)
              
              print("\nNo resources modified.", file=f)
          PY
