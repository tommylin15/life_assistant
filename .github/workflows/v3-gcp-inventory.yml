name: V3 GCP Dependency Inventory (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/v3-gcp-inventory.yml
      - .github/workflows/v3-release-ghcr.yml
      - .github/scripts/v3_revision_retention.py
      - .github/scripts/v3_gcp_inventory.py
      - .github/scripts/v3_ar_docker_inventory.py

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate for read-only inventory
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect dependency metadata without deleting anything
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/v3_gcp_inventory.py \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            | tee "$RUNNER_TEMP/v3-gcp-inventory.json"
          python - "$RUNNER_TEMP/v3-gcp-inventory.json" <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              print("## V3 GCP dependency inventory (read only)", file=out)
              for name, value in d["checks"].items():
                  print(f"- {name}: {value['status']}; count={value.get('count','?')}", file=out)
              print("No resource was modified or deleted.", file=out)
          if any(v["status"] != "PASS" for v in d["checks"].values()):
              raise SystemExit("Inventory partial: missing GCP read permissions or API readback")
          PY
      - name: Verify both retired life_assistant Cloud Build triggers disabled
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/v3-gcp-inventory.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              checks = json.load(f)["checks"]
          observed = checks["cloud_build_triggers"]
          expected = {
              "life-assistant-v2-main": "70ca60f2-8519-40c4-9422-5ac78f1b355f",
              "life-assistant-v2-release": "892a893e-173f-49b2-9055-d5a9adc21496",
          }
          triggers = observed.get("triggers", [])
          actual = {t["name"]: t for t in triggers}
          ok = (
              observed["status"] == "PASS"
              and len(triggers) == len(expected)
              and set(actual) == set(expected)
              and all(actual[name]["id"] == ident
                      and actual[name].get("disabled") is True
                      for name, ident in expected.items())
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              for name, ident in expected.items():
                  t = actual.get(name, {})
                  status = "PASS" if t.get("id") == ident and t.get("disabled") is True else "FAIL"
                  print(f"- retired_trigger_readback={status} name={name} id={ident}", file=out)
              print(f"- retired_triggers_all_disabled={'PASS' if ok else 'FAIL'}", file=out)
          if not ok:
              raise SystemExit("Retired life_assistant triggers not both confirmed disabled")
          PY
      - name: Recheck only bounded legacy GCS CI/CD bucket object metadata
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/v3_gcs_object_inventory.py \
            --project "$GCP_PROJECT_ID" \
            | tee "$RUNNER_TEMP/v3-gcs-candidates.json"
          python - "$RUNNER_TEMP/v3-gcs-candidates.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              result = json.load(fh)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              print("## Bounded legacy GCS inventory — metadata only", file=out)
              for bucket in result["buckets"]:
                  print(
                      f"- {bucket['bucket']}: readback={bucket['readback']}; "
                      f"objects={bucket.get('objects','?')}; "
                      f"candidate_build={bucket.get('categories',{}).get('POSSIBLE_CLOUD_BUILD',0)}; "
                      f"protected={bucket.get('categories',{}).get('UNCLASSIFIED_PROTECTED',0)}; "
                      "deletion_eligible=NO",
                      file=out,
                  )
          if result["mode"] != "READ_ONLY":
              raise SystemExit("Unsafe GCS inventory mode")
          if any(x["readback"] != "PASS" or x.get("deletion_eligible") is not False
                 for x in result["buckets"]):
              raise SystemExit("GCS metadata inventory incomplete, delete forbidden")
          PY

      - name: Inventory AR Docker image digests versus scoped Cloud Run references (no deletion)
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/v3_ar_docker_inventory.py \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            | tee "$RUNNER_TEMP/v3-ar-docker-inventory.json"
          python - "$RUNNER_TEMP/v3-ar-docker-inventory.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              obj=json.load(f)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              print("## AR Docker image inventory — read-only", file=out)
              print(f"- status={obj['status']}; region={obj['cloud_run_scope']['region']}", file=out)
              for repo in obj["repositories"]:
                  if repo["format"].upper() != "DOCKER":
                      print(f"- {repo['repository']}: non-Docker, not assessed", file=out)
                  else:
                      print(f"- {repo['repository']}: Docker digests={repo.get('docker_digest_count','?')}; "
                            f"Cloud Run referenced={repo.get('referenced','?')}; "
                            f"unreferenced in checked region={repo.get('unreferenced_scope_only','?')}; "
                            "deletion_eligible=NO",file=out)
              print("No image/tag/digest/repository was deleted or approved for deletion.",file=out)
          if obj["status"] != "PASS":
              raise SystemExit("AR reference assessment incomplete; deletion forbidden")
          PY
