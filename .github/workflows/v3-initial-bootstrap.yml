# Calendar #8 nested-Navigator dialog fix: final guarded one-time V3 + Firebase + true account + browser E2E verification.
name: V3 One-Time Controlled Release Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/v3-initial-bootstrap.yml

permissions:
  contents: read
  checks: read
  actions: write

jobs:
  dispatch-after-ci:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[calendar-e2e-one-time]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: tommylin15/life_assistant
    steps:
      - name: Checkout for GitHub CLI repository context
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for same-SHA full CI before releasing
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 80); do
            RESULT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
            PASSED="$(printf '%s' "$RESULT" | jq '
              [.check_runs[] |
               select(.name=="flutter" or .name=="backend" or .name=="deployment-scripts") |
               select(.conclusion=="success") | .name] | unique | length')"
            FAILED="$(printf '%s' "$RESULT" | jq '
              [.check_runs[] |
               select(.name=="flutter" or .name=="backend" or .name=="deployment-scripts") |
               select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out")] | length')"
            if [ "$FAILED" -gt 0 ]; then
              echo "::error::Mandatory CI failed; no image publication or Cloud Run changes permitted"
              exit 1
            fi
            if [ "$PASSED" -eq 3 ]; then
              echo "full_ci=PASS source=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::CI not confirmed PASS for full main SHA"
          exit 1

      - name: Test jq traffic guards before controlled promotion
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/traffic-baseline.json" <<'JSON'
          {"status":{"traffic":[{"revisionName":"baseline", "percent":100},{"revisionName":"candidate", "percent":0,"tag":"v3"}]}}
          JSON
          printf '%s\n' '{"status":{"traffic":[{"revisionName":"unexpected","percent":100}]}}' > "$RUNNER_TEMP/traffic-changed.json"
          jq -e --slurpfile previous "$RUNNER_TEMP/traffic-baseline.json" \
            '(.status.traffic | map(select((.percent // 0)>0) | {revisionName, percent:(.percent // 0)})) ==
             ($previous[0].status.traffic | map(select((.percent // 0)>0) | {revisionName, percent:(.percent // 0)}))' \
            "$RUNNER_TEMP/traffic-baseline.json" >/dev/null
          jq -e --slurpfile previous "$RUNNER_TEMP/traffic-baseline.json" \
            '([.status.traffic[] | select((.percent // 0)>0) |
                 {revisionName, percent}] | sort_by(.revisionName)) ==
             ([$previous[0].status.traffic[] | select((.percent // 0)>0) |
                 {revisionName, percent}] | sort_by(.revisionName))' \
            "$RUNNER_TEMP/traffic-baseline.json" >/dev/null
          if jq -e --slurpfile previous "$RUNNER_TEMP/traffic-baseline.json" \
            '(.status.traffic | map(select((.percent // 0)>0) | {revisionName, percent:(.percent // 0)})) ==
             ($previous[0].status.traffic | map(select((.percent // 0)>0) | {revisionName, percent:(.percent // 0)}))' \
            "$RUNNER_TEMP/traffic-changed.json" >/dev/null; then
            echo "::error::Production traffic mismatch must fail closed"
            exit 1
          fi
          echo "jq_traffic_compatibility=PASS positive_and_negative" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch exactly one verified V3 release
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$MAIN_SHA" = "$GITHUB_SHA"
          gh workflow run v3-release-ghcr.yml --ref main \
            --field release_sha="$GITHUB_SHA" --raw-field promote=true
          echo "v3_release_dispatch=REQUESTED sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual promotion and cutover remain conditional on every candidate/Preview/live gate." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for exact-SHA V3 release and verify mandatory live gates
        shell: bash
        run: |
          set -euo pipefail
          FOUND=""
          for ATTEMPT in $(seq 1 150); do
            MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
            test "$MAIN_SHA" = "$GITHUB_SHA"
            RESULTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v3-release-ghcr.yml/runs?per_page=50")"
            FOUND="$(printf '%s' "$RESULTS" | jq -c --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha==$sha and .event=="workflow_dispatch")]
              | sort_by(.run_number) | last // null')"
            if [ "$FOUND" != "null" ]; then
              STATUS="$(printf '%s' "$FOUND" | jq -r '.status')"
              if [ "$STATUS" = "completed" ]; then
                RESULT="$(printf '%s' "$FOUND" | jq -r '.conclusion')"
                RELEASE_ID="$(printf '%s' "$FOUND" | jq -r '.id')"
                test "$RESULT" = "success" || { echo "::error::V3 release not successful, run=$RELEASE_ID"; exit 1; }
                JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_ID/jobs?per_page=100")"
                printf '%s' "$JOBS" | jq -e '
                  [.jobs[].steps[] |
                   select(.name=="Post-promotion live health, OAuth redirect, PostgreSQL and access gates" or
                          .name=="Controlled rollback rehearsal and restore promoted live traffic" or
                          .name=="Retain latest 10 revisions after all live gates PASS") |
                   select(.conclusion=="success") | .name] | unique | length==3'
                echo "v3_live_gates=PASS run=$RELEASE_ID sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::No completed same-SHA V3 release within bounded verification"
          exit 1

      - name: Dispatch production Hosting and true-account Calendar acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$GITHUB_SHA"
          gh workflow run deploy-firebase-hosting.yml --ref main
          gh workflow run calendar-true-account-acceptance.yml --ref main
          echo "calendar_firebase=REQUESTED sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "calendar_true_account=REQUESTED sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Require production Hosting before desktop/mobile UI and verify true account
        shell: bash
        run: |
          set -euo pipefail
          wait_dispatch() {
            local workflow="$1" attempts="$2" json selected status result run_url
            for ((attempt=1; attempt<=attempts; attempt++)); do
              json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=50")"
              selected="$(printf '%s' "$json" | jq -c --arg sha "$GITHUB_SHA" '
                [.workflow_runs[] | select(.head_sha==$sha and .event=="workflow_dispatch")]
                | sort_by(.run_number) | last // null')"
              if [ "$selected" != "null" ]; then
                status="$(printf '%s' "$selected" | jq -r '.status')"
                if [ "$status" = "completed" ]; then
                  result="$(printf '%s' "$selected" | jq -r '.conclusion')"
                  run_url="$(printf '%s' "$selected" | jq -r '.html_url')"
                  echo "$workflow=$result url=$run_url" >> "$GITHUB_STEP_SUMMARY"
                  if [ "$result" != "success" ]; then
                    echo "::error::Same-SHA workflow failed: $run_url"
                    return 1
                  fi
                  return 0
                fi
              fi
              sleep 15
            done
            echo "::error::Same-SHA acceptance not completed: $workflow"
            return 1
          }
          wait_dispatch deploy-firebase-hosting.yml 120
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$GITHUB_SHA"
          gh workflow run calendar-ui-acceptance.yml --ref main
          echo "calendar_ui=REQUESTED sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          wait_dispatch calendar-ui-acceptance.yml 90
          wait_dispatch calendar-true-account-acceptance.yml 45
          echo "calendar_e2e=PASS sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Bounded retry of Preview propagation verification after 404 from the
  # previous V3 production run. CI -> 0%-traffic candidate -> Preview only.
  # Never modifies staging live, production Hosting or production traffic.
  v3-preview-retry-once:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[life-v3-preview-retry1]')
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact source SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require current main and all four quality gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for ATTEMPT in $(seq 1 100); do
            MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
            test "$MAIN_SHA" = "$GITHUB_SHA"
            RESULT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
            FAILED="$(printf '%s' "$RESULT" | jq '
              [.check_runs[] |
               select(.name=="backend" or .name=="flutter" or .name=="deployment-scripts" or .name=="free-events-postgres") |
               select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out")] | length')"
            PASSED="$(printf '%s' "$RESULT" | jq '
              [.check_runs[] |
               select(.name=="backend" or .name=="flutter" or .name=="deployment-scripts" or .name=="free-events-postgres") |
               select(.conclusion=="success") | .name] | unique | length')"
            if ((FAILED > 0)); then
              echo "::error::Current SHA failed required quality gate; deployment stopped"
              exit 1
            fi
            if ((PASSED == 4)); then
              echo "candidate_source_ci=PASS sha=$GITHUB_SHA required=4/4" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Four CI jobs not confirmed for this SHA"
          exit 1

      - name: Dispatch only existing exact SHA V3 candidate pipeline
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$GITHUB_SHA"
          gh workflow run v3-release-ghcr.yml --ref main \
            --raw-field release_sha="$GITHUB_SHA" \
            --raw-field promote=false \
            --raw-field publish_staging=false
          echo "v3_candidate_dispatch=REQUESTED sha=$GITHUB_SHA promote=false staging_live=false" >> "$GITHUB_STEP_SUMMARY"

      - name: Check exact SHA 0 percent candidate and preview results
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 180); do
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$GITHUB_SHA"
            RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v3-release-ghcr.yml/runs?per_page=35")"
            SELECTED="$(printf '%s' "$RUNS" | jq -c --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.event=="workflow_dispatch" and .head_sha==$sha)]
              | sort_by(.run_number) | last // null')"
            if [[ "$SELECTED" != "null" ]]; then
              STATUS="$(printf '%s' "$SELECTED" | jq -r '.status')"
              if [[ "$STATUS" == "completed" ]]; then
                RELEASE_ID="$(printf '%s' "$SELECTED" | jq -r '.id')"
                CONCLUSION="$(printf '%s' "$SELECTED" | jq -r '.conclusion')"
                echo "v3_candidate_release=$CONCLUSION run=$RELEASE_ID sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                test "$CONCLUSION" = "success" || exit 1
                JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_ID/jobs?per_page=100")"
                printf '%s' "$JOBS" | jq -e '
                  [.jobs[].steps[] | select(
                     .name=="Create 0%-traffic digest-pinned candidate" or
                     .name=="Candidate health, database readiness, auth and authorization" or
                     .name=="Run real database/auth acceptance using release digest" or
                     .name=="Verify pinned Preview API and static release" or
                     .name=="Require explicit promotion selection"
                   ) | select(.conclusion=="success") | .name] | unique | length==5'
                printf '%s' "$JOBS" | jq -e '
                  [.jobs[].steps[] | select(
                    .name=="Reconfirm source SHA and live traffic, then promote" or
                    .name=="Promote exact Preview to independent fixed staging live and verify owner OAuth"
                  ) | select(.conclusion!="skipped")] | length==0'
                echo "v3_candidate_only=PASS sha=$GITHUB_SHA release=$RELEASE_ID production_promotion=SKIPPED staging_live=SKIPPED" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "::error::Exact-SHA V3 candidate did not complete within bounded check"
          exit 1

  # One-time user-approved V3 production release. All genuine staging owner
  # OAuth, PostgreSQL, live, rollback and retention gates stay unchanged.
  v3-live-once:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[life-v3-live-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact approved production SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require unchanged main and all four exact-SHA CI gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for ATTEMPT in $(seq 1 120); do
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$GITHUB_SHA"
            CHECKS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
            FAILED="$(printf '%s' "$CHECKS" | jq '[.check_runs[] |
              select(.name=="backend" or .name=="flutter" or .name=="deployment-scripts" or .name=="free-events-postgres") |
              select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out")] | length')"
            PASSED="$(printf '%s' "$CHECKS" | jq '[.check_runs[] |
              select(.name=="backend" or .name=="flutter" or .name=="deployment-scripts" or .name=="free-events-postgres") |
              select(.conclusion=="success") | .name] | unique | length')"
            if (( FAILED > 0 )); then
              echo "::error::Mandatory CI failed; release prohibited"
              exit 1
            fi
            if (( PASSED == 4 )); then
              echo "same_sha_ci=PASS sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Exact-SHA CI not fully successful"
          exit 1

      - name: Dispatch existing V3 gated live release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$GITHUB_SHA"
          gh workflow run v3-release-ghcr.yml --ref main \
            --raw-field release_sha="$GITHUB_SHA" \
            --raw-field publish_staging=true \
            --raw-field promote=true
          echo "v3_live=REQUESTED sha=$GITHUB_SHA staging_owner_oauth=REQUIRED" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify V3 true staging OAuth and production promotion gates
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 600); do
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$GITHUB_SHA"
            RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v3-release-ghcr.yml/runs?per_page=50")"
            SELECTED="$(printf '%s' "$RUNS" | jq -c --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha==$sha and .event=="workflow_dispatch")]
              | sort_by(.run_number) | last // null')"
            if [[ "$SELECTED" != "null" ]] && [[ "$(printf '%s' "$SELECTED" | jq -r '.status')" == "completed" ]]; then
              RUN_ID="$(printf '%s' "$SELECTED" | jq -r '.id')"
              RESULT="$(printf '%s' "$SELECTED" | jq -r '.conclusion')"
              echo "v3_live=$RESULT run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              test "$RESULT" = "success" || { echo "::error::V3 not PASS; block production Hosting"; exit 1; }
              JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
              printf '%s' "$JOBS" | jq -e '
                [.jobs[].steps[] | select(
                  .name=="Create 0%-traffic digest-pinned candidate" or
                  .name=="Run real database/auth acceptance using release digest" or
                  .name=="Verify pinned Preview API and static release" or
                  .name=="Read-only fixed staging preview and rollback baseline preflight" or
                  .name=="Apply additive 0015 schema before production cutover" or
                  .name=="Rollback-only curated pool migration and personal UI runtime acceptance" or
                  .name=="Pre-promotion Drive AI consent runtime acceptance" or
                  .name=="Promote exact Preview to independent fixed staging live and verify owner OAuth" or
                  .name=="Reconfirm source SHA and live traffic, then promote" or
                  .name=="Post-promotion live health, OAuth redirect, PostgreSQL and access gates" or
                  .name=="Controlled rollback rehearsal and restore promoted live traffic" or
                  .name=="Retain latest 10 revisions after all live gates PASS"
                ) | select(.conclusion=="success") | .name] | unique | length==12'
              echo "v3_staging_oauth_prod_rollback=PASS run=$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::V3 release did not complete, production Hosting prohibited"
          exit 1

      - name: Dispatch existing production Hosting only after V3 PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$GITHUB_SHA"
          gh workflow run deploy-firebase-hosting.yml --ref main
          echo "production_hosting=REQUESTED sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact-SHA production Hosting and existing UI gates
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 320); do
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = "$GITHUB_SHA"
            RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-firebase-hosting.yml/runs?per_page=50")"
            SELECTED="$(printf '%s' "$RUNS" | jq -c --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha==$sha and .event=="workflow_dispatch")]
              | sort_by(.run_number) | last // null')"
            if [[ "$SELECTED" != "null" ]] && [[ "$(printf '%s' "$SELECTED" | jq -r '.status')" == "completed" ]]; then
              RUN_ID="$(printf '%s' "$SELECTED" | jq -r '.id')"
              RESULT="$(printf '%s' "$SELECTED" | jq -r '.conclusion')"
              echo "production_hosting=$RESULT run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_STEP_SUMMARY"
              test "$RESULT" = "success"
              BASE="https://gen-lang-client-0593591102.web.app"
              test "$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE/release.txt")" = "$GITHUB_SHA"
              test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/v1/tasks")" = 401
              test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/auth/me")" = 401
              echo "production_hosting_and_ui=PASS sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Exact-SHA production Hosting/UI did not complete"
          exit 1


  oauth-callback-readback-once:
    # One-time read-only probe: do not follow Google redirects or print state/client IDs.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[life-oauth-route-probe1]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose site-local Google callback without exposing OAuth secrets
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          sites={
            "preview":"life-assistant-v3-stage-tl15--v3-37299e392f-fkak5lm7.web.app",
            "fixed_stage":"life-assistant-v3-stage-tl15.web.app",
            "production":"gen-lang-client-0593591102.web.app",
          }
          for label,host in sites.items():
              request=urllib.request.Request("https://"+host+"/auth/login",headers={"Cache-Control":"no-cache"})
              try:
                  response=opener.open(request, timeout=20)
              except urllib.error.HTTPError as exc:
                  response=exc
              location=urllib.parse.urlparse(response.headers.get("Location",""))
              query=urllib.parse.parse_qs(location.query)
              redirect_uri=query.get("redirect_uri",[""])[0]
              cookie=response.headers.get("Set-Cookie","")
              print(f"site={label} login_http={response.status} google_redirect_host={location.hostname} callback={redirect_uri} has_oauth_cookie={cookie.startswith('__session=oauth%3A') or cookie.startswith('__session=\"oauth:') or cookie.startswith('__session=oauth:')} cookie_secure={'secure' in cookie.lower()} cookie_samesite_lax={'samesite=lax' in cookie.lower()}")
              if response.status not in (302,303,307,308) or location.hostname != "accounts.google.com":
                  raise SystemExit(f"login redirect is not Google for {label}")
              if label=="fixed_stage" and redirect_uri!="https://"+host+"/auth/callback":
                  print("fixed_staging_oauth_origin=FAIL mismatched callback and state cookie domain")
              elif label=="preview" and redirect_uri!="https://"+host+"/auth/callback":
                  print("preview_oauth_origin=UNSUPPORTED ephemeral Preview callback; use fixed staging")
              else:
                  print(f"{label}_oauth_origin=PASS")
          PY
