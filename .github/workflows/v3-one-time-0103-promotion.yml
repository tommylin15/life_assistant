# One-time, explicitly requested 01-03 production promotion.
# This is NOT a standing automatic promotion path. Only the exact uniquely
# identified request commit is eligible. Archive after the controlled run.
name: Life 01-03 One-time Production Request

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: life-0103-one-time-production-dispatch
  cancel-in-progress: false

jobs:
  request:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Enforce one-time request identity, immutable main, four CI gates
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo 'dispatch=false' >> "$GITHUB_OUTPUT"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
          # Do not permit any later CI commit, PR or unrelated actor to request
          # production using this workflow. The two-file one-time source change
          # and exact commit message identify this request.
          DETAILS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA?per_page=100")"
          jq -e '.commit.message == "ops(life): request one-time 01-03 production promotion"'             <<< "$DETAILS" >/dev/null || exit 0
          jq -e '[.files[].filename] | sort == [
             ".github/workflows/v3-auto-staging-after-ci.yml",
             ".github/workflows/v3-one-time-0103-promotion.yml"
          ]' <<< "$DETAILS" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"             | jq -e --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY"                 '.status=="completed" and .conclusion=="success" and
                 .head_sha==$sha and .event=="push" and
                 .head_branch=="main" and .head_repository.full_name==$repo' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100"             | jq -e '[.jobs[] | select(
                .name=="backend" or .name=="flutter" or
                .name=="deployment-scripts" or .name=="free-events-postgres"
              ) | select(.conclusion=="success") | .name] |
              unique | length==4' >/dev/null
          # Re-dispatch is never allowed for the same immutable commit.
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v3-release-ghcr.yml/runs?event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$RELEASE_SHA" 'any(.workflow_runs[]; .head_sha==$sha)'              <<< "$EXISTING" >/dev/null; then
            echo "one_time_promotion=SKIP already_dispatched_sha=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'dispatch=true' >> "$GITHUB_OUTPUT"
          echo "one_time_promotion=AUTHORIZED sha=$RELEASE_SHA ci=$CI_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch unmodified V3 release with all production gates
        if: ${{ steps.gate.outputs.dispatch == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
          gh workflow run v3-release-ghcr.yml --repo "$GITHUB_REPOSITORY" --ref main             --raw-field promote=true             --raw-field publish_staging=true
          echo "one_time_promotion=DISPATCHED sha=$RELEASE_SHA promote=true publish_staging=true" >> "$GITHUB_STEP_SUMMARY"
          echo 'The V3 workflow independently gates exact SHA, CI, migration, rollback-only DB, fixed staging,' >> "$GITHUB_STEP_SUMMARY"
          echo 'OAuth automated tests, promotion, postdeploy integration, traffic rollback and importer digest pin.' >> "$GITHUB_STEP_SUMMARY"
