name: V3 P0 P1 Joint Acceptance (read only)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Release SHA to verify"
        type: string
        required: true
      expected_stage_revision:
        description: "Expected staging Cloud Run revision"
        type: string
        required: true

permissions:
  contents: read
  id-token: write
  checks: read

concurrency:
  group: life-assistant-v3-production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      STAGING_SITE: life-assistant-v3-stage-tl15
      EXPECTED_SHA: ${{ inputs.release_sha }}
      EXPECTED_REV: ${{ inputs.expected_stage_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Validate inputs
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_REV" =~ ^life-assistant-api-[A-Za-z0-9-]+$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Verify staging and production
        run: |
          STAGE_URL="https://$STAGING_SITE.web.app"
          PROD_URL="https://$GCP_PROJECT_ID.web.app"
          
          # Verify SHAs
          test "$(curl -fsSL "$STAGE_URL/release.txt")" = "$EXPECTED_SHA"
          test "$(curl -fsSL "$PROD_URL/release.txt")" = "$EXPECTED_SHA"
          
          # Verify 401 protection
          for url in "$STAGE_URL" "$PROD_URL"; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/v1/tasks")" = 401
            test "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/v1/free-events")" = 401
          done
          
          # Verify staging OAuth redirect
          curl -sS -D "$RUNNER_TEMP/login" -o /dev/null "$STAGE_URL/auth/login"
          grep -Fq "redirect_uri=https%3A%2F%2F$STAGING_SITE.web.app%2Fauth%2Fcallback" "$RUNNER_TEMP/login"
          
          # Verify production traffic unchanged
          gcloud run services describe life-assistant-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            | jq -e '[.status.traffic[] | select(.percent==100)] | length == 1'
          
          echo "## P0/P1 Joint Acceptance PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging revision: $EXPECTED_REV" >> "$GITHUB_STEP_SUMMARY"
