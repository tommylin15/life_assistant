name: V3 Release - GHCR to Cloud Run

on:
  workflow_dispatch:
    inputs:
      auto_promote:
        description: "Auto-promote to production after all gates pass (no manual intervention)"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      auto_promote:
        description: "Auto-promote to production"
        required: false
        default: true
        type: boolean
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_DEPLOY_SERVICE_ACCOUNT:
        required: true

permissions:
  contents: read
  checks: read
  id-token: write
  packages: write

concurrency:
  group: life-assistant-v3-production-release
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0593591102
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: life-assistant-api
  GHCR_IMAGE: ghcr.io/tommylin15/life_assistant-backend
  STAGING_SITE: life-assistant-v3-stage-tl15
  PROD_SITE: gen-lang-client-0593591102

jobs:
  # ============================================================
  # Stage 1: Build, scan, publish image
  # ============================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_ref: ${{ steps.publish.outputs.ref }}
      release_sha: ${{ github.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Guard main SHA and CI success
        run: |
          set -euo pipefail
          RELEASE_SHA="${{ github.sha }}"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$MAIN_SHA" = "$RELEASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" \
            | jq -e '[.check_runs[] | select(.name=="flutter" or .name=="backend" or .name=="deployment-scripts" or .name=="free-events-postgres") | select(.conclusion=="success") | .name] | unique | length == 4'

      - name: Build Docker image
        run: docker build --pull --platform linux/amd64 -t "$GHCR_IMAGE:${{ github.sha }}" backend

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          scanners: vuln,secret
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        id: publish
        run: |
          docker push "$GHCR_IMAGE:${{ github.sha }}"
          IMAGE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' "$GHCR_IMAGE:${{ github.sha }}")"
          [[ "$IMAGE_REF" =~ ^ghcr[.]io/tommylin15/life_assistant-backend@sha256:[a-f0-9]{64}$ ]]
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Stage 2: Deploy candidate (0% traffic) and run migrations
  # ============================================================
  deploy-candidate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-test
    outputs:
      candidate_revision: ${{ steps.candidate.outputs.revision }}
      candidate_url: ${{ steps.candidate.outputs.url }}
      previous_revisions: ${{ steps.baseline.outputs.previous }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Capture baseline traffic
        id: baseline
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/pre-service.json"
          PREVIOUS="$(jq -r '[.status.traffic[] | select((.percent // 0)>0) | "\(.revisionName)=\(.percent)"] | join(",")' "$RUNNER_TEMP/pre-service.json")"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Deploy 0%-traffic candidate
        id: candidate
        run: |
          TAG="v3-$(printf '%s' "${{ github.sha }}" | cut -c1-10)"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "${{ needs.build.outputs.image_ref }}" \
            --no-traffic --tag "$TAG" --quiet
          
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json \
            > "$RUNNER_TEMP/candidate-service.json"
          
          REVISION="$(jq -r '.status.latestReadyRevisionName' "$RUNNER_TEMP/candidate-service.json")"
          URL="$(jq -r --arg tag "$TAG" '.status.traffic[] | select(.tag==$tag) | .url' "$RUNNER_TEMP/candidate-service.json")"
          
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run database migration
        run: |
          gcloud run jobs update life-assistant-db-migrate \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "${{ needs.build.outputs.image_ref }}" --quiet
          
          .github/scripts/run_cloud_run_job_with_diagnostics.sh life-assistant-db-migrate \
            gcloud run jobs execute life-assistant-db-migrate \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --args=-m,scripts.apply_cloud_domain_parity_release \
            --task-timeout 10m --wait --quiet

      - name: Verify candidate health
        run: |
          URL="${{ steps.candidate.outputs.url }}"
          curl --fail --silent --retry 5 --retry-delay 3 "$URL/health" >/dev/null
          curl --fail --silent --retry 3 --retry-delay 3 "$URL/ready" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/v1/tasks")" = 401

  # ============================================================
  # Stage 3: Core acceptance tests (PARALLEL)
  # ============================================================
  core-acceptance:
    needs: [build, deploy-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev-test
    strategy:
      fail-fast: false
      matrix:
        module:
          - scripts.run_cloud_domain_parity_acceptance
          - scripts.run_checklist_cloud_acceptance
          - scripts.run_idempotency_acceptance
          - scripts.run_google_failure_acceptance
          - scripts.run_sqlite_backfill_acceptance
          - scripts.run_sqlite_backfill_failure_acceptance
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Update job image
        run: |
          gcloud run jobs update life-assistant-core-acceptance \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "${{ needs.build.outputs.image_ref }}" --quiet

      - uses: ./.github/actions/run-acceptance-job
        with:
          job_name: life-assistant-core-acceptance
          module: ${{ matrix.module }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}

  # ============================================================
  # Stage 4: Build Flutter and deploy staging preview
  # ============================================================
  staging-preview:
    needs: [build, deploy-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev-test
    outputs:
      preview_url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Build Flutter web
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/prepare_branding_assets.py
          flutter pub get
          flutter build web --target=lib/main_web.dart --no-pub
          printf '%s\n' "${{ github.sha }}" > build/web/release.txt

      - name: Configure staging rewrites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("firebase.json").read_text())
          cfg["hosting"]["site"] = "${{ env.STAGING_SITE }}"
          for item in cfg["hosting"]["rewrites"]:
              if item.get("run", {}).get("serviceId") == "life-assistant-api":
                  item["run"]["pinTag"] = True
          Path("firebase.json").write_text(json.dumps(cfg, indent=2) + "\n")
          PY

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy preview channel
        id: preview
        run: |
          npm install --global firebase-tools
          CHANNEL="v3-$(printf '%s' "${{ github.sha }}" | cut -c1-10)"
          firebase hosting:channel:deploy "$CHANNEL" \
            --expires 1d --project "$GCP_PROJECT_ID" --no-authorized-domains --json \
            > "$RUNNER_TEMP/preview.json"
          
          PREVIEW_URL="$(jq -r '[.. | objects | .url? // empty | select(type=="string" and (contains("web.app") or contains("firebaseapp.com")))] | first // empty' "$RUNNER_TEMP/preview.json")"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify preview
        run: |
          PREVIEW_URL="${{ steps.preview.outputs.url }}"
          for i in {1..12}; do
            SHA="$(curl -fsSL -H 'Cache-Control: no-cache' "$PREVIEW_URL/release.txt" || true)"
            [ "$SHA" = "${{ github.sha }}" ] && break
            sleep 5
          done
          test "$SHA" = "${{ github.sha }}"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL/api/v1/tasks")" = 401

  # ============================================================
  # Stage 5: Publish staging live
  # ============================================================
  staging-live:
    needs: [build, deploy-candidate, core-acceptance, staging-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-test
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Promote preview to staging live
        run: |
          npm install --global firebase-tools
          CHANNEL="v3-$(printf '%s' "${{ github.sha }}" | cut -c1-10)"
          firebase hosting:clone "$STAGING_SITE:$CHANNEL" "$STAGING_SITE:live" \
            --project "$GCP_PROJECT_ID" --json

      - name: Verify staging live
        run: |
          STAGE_URL="https://$STAGING_SITE.web.app"
          for i in {1..12}; do
            SHA="$(curl -fsSL -H 'Cache-Control: no-cache' "$STAGE_URL/release.txt" || true)"
            [ "$SHA" = "${{ github.sha }}" ] && break
            sleep 5
          done
          test "$SHA" = "${{ github.sha }}"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$STAGE_URL/api/v1/tasks")" = 401
          
          # Verify OAuth redirect
          curl -sS -D "$RUNNER_TEMP/login-headers" -o /dev/null "$STAGE_URL/auth/login"
          grep -Fq "redirect_uri=https%3A%2F%2F$STAGING_SITE.web.app%2Fauth%2Fcallback" "$RUNNER_TEMP/login-headers"

  # ============================================================
  # Stage 6: Production promotion (AUTO if enabled)
  # ============================================================
  production-promote:
    needs: [build, deploy-candidate, core-acceptance, staging-live]
    if: ${{ inputs.auto_promote != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev-test
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Final SHA check before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$MAIN_SHA" = "${{ github.sha }}"

      - name: Promote to 100% traffic
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --to-revisions="${{ needs.deploy-candidate.outputs.candidate_revision }}=100" --quiet

      - name: Verify production health
        run: |
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')"
          curl --fail --silent --retry 5 "$SERVICE_URL/health" >/dev/null
          curl --fail --silent --retry 3 "$SERVICE_URL/ready" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SERVICE_URL/api/v1/tasks")" = 401

      - name: Run post-deploy acceptance
        run: |
          gcloud run jobs update life-assistant-postdeploy-acceptance \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "${{ needs.build.outputs.image_ref }}" --quiet
          
          for module in \
            scripts.run_notes_product_acceptance \
            scripts.run_project_drive_runtime_acceptance \
            scripts.run_drive_ai_enrichment_acceptance; do
            .github/scripts/run_cloud_run_job_with_diagnostics.sh life-assistant-postdeploy-acceptance \
              gcloud run jobs execute life-assistant-postdeploy-acceptance \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --args="-m,$module" --task-timeout 10m --wait --quiet
          done

      - name: Rollback on failure
        if: failure()
        run: |
          PREVIOUS="${{ needs.deploy-candidate.outputs.previous_revisions }}"
          if [ -n "$PREVIOUS" ]; then
            gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --to-revisions="$PREVIOUS" --quiet
            echo "::warning::Rolled back to $PREVIOUS"
          fi

  # ============================================================
  # Stage 7: Production Hosting
  # ============================================================
  production-hosting:
    needs: [build, production-promote]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Build Flutter web
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/prepare_branding_assets.py
          flutter pub get
          flutter build web --target=lib/main_web.dart --no-pub
          printf '%s\n' "${{ github.sha }}" > build/web/release.txt

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy production Hosting
        run: |
          npm install --global firebase-tools
          firebase deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive

      - name: Verify production Hosting
        run: |
          PROD_URL="https://$PROD_SITE.web.app"
          for i in {1..12}; do
            SHA="$(curl -fsSL -H 'Cache-Control: no-cache' "$PROD_URL/release.txt" || true)"
            [ "$SHA" = "${{ github.sha }}" ] && break
            sleep 5
          done
          test "$SHA" = "${{ github.sha }}"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/api/v1/tasks")" = 401

      - uses: ./.github/actions/setup-playwright

      - name: Run production UI acceptance
        run: |
          BASE_URL="https://$PROD_SITE.web.app"
          BASE_URL="$BASE_URL" node .github/scripts/verify_task_ui_production.mjs
          BASE_URL="$BASE_URL" node .github/scripts/verify_project_ui_production.mjs

  # ============================================================
  # Stage 8: Cleanup and pin handoff job
  # ============================================================
  finalize:
    needs: [build, deploy-candidate, production-promote, production-hosting]
    if: ${{ always() && needs.production-promote.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev-test
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Pin curated handoff job
        run: |
          gcloud run jobs update life-assistant-free-events \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "${{ needs.build.outputs.image_ref }}" \
            --command python \
            --args=-m,scripts.import_curated_from_sheet \
            --update-env-vars=LIFE_CURATED_SHEET_ID=1OZdQPmypZ1zwB65K4oQOr3VBGP2GAFMmBnZsqAW5ob4,LIFE_CURATED_IMPORT_APPLY=1 \
            --quiet

      - name: Retain latest 10 revisions
        run: |
          python .github/scripts/v3_revision_retention.py \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --service "$CLOUD_RUN_SERVICE" --keep 10 \
            --expected-live-revision "${{ needs.deploy-candidate.outputs.candidate_revision }}" \
            --apply --live-passed

      - name: Summary
        run: |
          echo "## Release Complete 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ needs.build.outputs.image_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: ${{ needs.deploy-candidate.outputs.candidate_revision }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: https://$PROD_SITE.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging: https://$STAGING_SITE.web.app" >> "$GITHUB_STEP_SUMMARY"
