name: V3 Staging Live - Manual Promotion

on:
  workflow_dispatch:
    inputs:
      release_sha:
        required: true
        description: "Source SHA to promote"
        type: string
      candidate_revision:
        required: true
        description: "Cloud Run revision to pin"
        type: string

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: life-assistant-v3-production-release
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      GCP_REGION: us-central1
      STAGING_SITE: life-assistant-v3-stage-tl15
      RELEASE_SHA: ${{ inputs.release_sha }}
      REVISION: ${{ inputs.candidate_revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Validate inputs
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVISION" =~ ^life-assistant-api-[a-zA-Z0-9-]+$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$RELEASE_SHA"
          
          # Verify CI passed
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs?per_page=100" | \
            jq -e '[.check_runs[] | select(.name=="flutter" or .name=="backend" or .name=="deployment-scripts") | select(.conclusion=="success")] | length >= 3'

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Verify revision exists
        run: |
          gcloud run revisions describe "$REVISION" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.conditions[0].status)' | grep -q True

      - name: Promote preview to staging live
        run: |
          npm install --global firebase-tools
          CHANNEL="v3-$(printf '%s' "$RELEASE_SHA" | cut -c1-10)"
          firebase hosting:clone "$STAGING_SITE:$CHANNEL" "$STAGING_SITE:live" \
            --project "$GCP_PROJECT_ID" --json

      - name: Verify staging live
        run: |
          STAGE_URL="https://$STAGING_SITE.web.app"
          for i in {1..12}; do
            SHA="$(curl -fsSL -H 'Cache-Control: no-cache' "$STAGE_URL/release.txt" || true)"
            [ "$SHA" = "$RELEASE_SHA" ] && break
            sleep 5
          done
          test "$SHA" = "$RELEASE_SHA"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$STAGE_URL/api/v1/tasks")" = 401
          
          curl -sS -D "$RUNNER_TEMP/login" -o /dev/null "$STAGE_URL/auth/login"
          grep -Fq "redirect_uri=https%3A%2F%2F$STAGING_SITE.web.app%2Fauth%2Fcallback" "$RUNNER_TEMP/login"
          
          echo "staging_live=PASS sha=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
