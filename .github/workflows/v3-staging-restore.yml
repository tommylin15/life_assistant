name: V3 Staging Restore

on:
  workflow_dispatch:
    inputs:
      restore_version:
        description: "Hosting version ID to restore"
        type: string
        required: true
      expected_sha:
        description: "Expected SHA of restore version"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: life-assistant-v3-production-release
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-test
    env:
      GCP_PROJECT_ID: gen-lang-client-0593591102
      STAGING_SITE: life-assistant-v3-stage-tl15
      RESTORE_VERSION: ${{ inputs.restore_version }}
      RESTORE_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          [[ "$RESTORE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RESTORE_VERSION" =~ ^sites/$STAGING_SITE/versions/[A-Za-z0-9_-]+$ ]]

      - uses: ./.github/actions/setup-gcp
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Restore version
        run: |
          npm install --global firebase-tools
          firebase hosting:clone "$STAGING_SITE:@$(basename "$RESTORE_VERSION")" "$STAGING_SITE:live" \
            --project "$GCP_PROJECT_ID" --json

      - name: Verify restore
        run: |
          STAGE_URL="https://$STAGING_SITE.web.app"
          for i in {1..12}; do
            SHA="$(curl -fsSL -H 'Cache-Control: no-cache' "$STAGE_URL/release.txt" || true)"
            [ "$SHA" = "$RESTORE_SHA" ] && break
            sleep 5
          done
          test "$SHA" = "$RESTORE_SHA"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$STAGE_URL/api/v1/tasks")" = 401
          
          echo "staging_restore=PASS version=$RESTORE_VERSION sha=$RESTORE_SHA" >> "$GITHUB_STEP_SUMMARY"
