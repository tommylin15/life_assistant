<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f4">
  <title>Life × LINE</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#18382e;background:#f3f6f4}
    body{max-width:720px;margin:auto;padding:20px 16px 48px}
    h1{font-size:1.5rem;margin-bottom:4px}
    p{line-height:1.5;color:#4d665c}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}
    button,a.action{font:inherit;cursor:pointer;border:1px solid #bed2c7;background:#fff;border-radius:14px;padding:14px;color:#18382e;text-align:center;text-decoration:none}
    button:focus-visible,a:focus-visible{outline:3px solid #315d48;outline-offset:2px}
    button:disabled{opacity:.45}
    button.primary{background:#196c52;color:#fff;border-color:#196c52}
    .panel{background:#fff;border:1px solid #d4e3dc;border-radius:16px;padding:16px;margin:12px 0}
    .muted{color:#63796f;font-size:.9rem}
    .item{padding:12px 0;border-bottom:1px solid #e5eee9;white-space:pre-wrap;overflow-wrap:anywhere}
    .item:last-child{border:0}
    .item button{padding:8px 16px;margin-top:8px}
    .buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    #error{color:#a12525}
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h1>Life × LINE</h1>
  <p>聊天先記成草稿，確認後再存入 Life。所有個人資料由 Life 帳號管理。</p>
  <div id="status" role="status" class="panel">正在確認 LINE 身分…</div>
  <div id="error" role="alert"></div>
  <div class="buttons">
    <button id="bind" class="primary" hidden>綁定目前的 Life 帳號</button>
    <button id="unbind" hidden>解除綁定</button>
    <a id="login" class="action" href="/auth/login" hidden>登入 Life（再返回這個選單）</a>
  </div>
  <div id="nav" class="grid" hidden>
    <button data-view="drafts">✍️ 快速記錄</button>
    <button data-view="summary">☀️ 今日總覽</button>
    <button data-view="search">🔎 查資料</button>
    <button data-view="summary">✅ 待辦・購物</button>
    <a class="action" href="/" rel="noopener">📅 日曆・活動</a>
    <a class="action" href="/" rel="noopener">🏠 我的 Life</a>
  </div>
  <section id="result" class="panel" aria-live="polite" hidden></section>
  <p class="muted">日曆與活動由 Life 原有登入頁管理；本頁不會擅自新增、完成或刪除事項。</p>
  <script>
    (() => {
      "use strict";
      let idToken = "";
      let linked = false;
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      const result = document.getElementById("result");
      const bind = document.getElementById("bind");
      const unbind = document.getElementById("unbind");
      const login = document.getElementById("login");
      const nav = document.getElementById("nav");
      const text = (tag, content, className = "") => {
        const el = document.createElement(tag);
        el.textContent = content;
        if (className) el.className = className;
        return el;
      };
      const setLinked = value => {
        linked = value;
        nav.hidden = !value;
        bind.hidden = value;
        unbind.hidden = !value;
        login.hidden = value;
        status.textContent = value ? "LINE 已綁定 Life，個人資料僅供此帳號查看。" : "尚未綁定 Life。請先登入 Life，回到這裡按綁定。";
      };
      async function api(path, opts = {}) {
        const headers = {...(opts.headers || {})};
        if (idToken && !opts.google) headers.Authorization = "Bearer " + idToken;
        if (opts.body) headers["Content-Type"] = "application/json";
        const response = await fetch("/api/v1/line/" + path, {
          method: opts.method || "GET",
          credentials: "same-origin",
          headers,
          body: opts.body ? JSON.stringify(opts.body) : undefined
        });
        if (!response.ok) throw new Error("操作無法完成 (HTTP " + response.status + ")");
        return response.json();
      }
      async function init() {
        try {
          const config = await api("config");
          if (!config.liff_id) throw new Error("尚未設定 LIFF ID，請先設定 LINE_LIFF_ID。");
          await liff.init({liffId: config.liff_id});
          if (!liff.isLoggedIn()) { liff.login(); return; }
          idToken = liff.getIDToken();
          if (!idToken) throw new Error("需要 LINE OpenID 授權，請檢查 LIFF scope。");
          try {
            await api("me"); setLinked(true);
            const requested = new URLSearchParams(window.location.search).get("view");
            if (requested === "drafts" || requested === "summary" || requested === "search") await show(requested);
          }
          catch (e) { setLinked(false); }
        } catch (e) {
          status.textContent = "LINE 功能尚未可用";
          error.textContent = e.message;
        }
      }
      bind.addEventListener("click", async () => {
        error.textContent = "";
        try {
          await api("bind", {method:"POST", body:{id_token:idToken}, google:true});
          setLinked(true);
        } catch (e) {
          login.hidden = false;
          error.textContent = "請先登入 Life，再返回這裡綁定。" + " " + e.message;
        }
      });
      unbind.addEventListener("click", async () => {
        if (!confirm("解除後 LINE 無法讀取個人資訊，新訊息也不會被保存。確定解除？")) return;
        error.textContent = "";
        try {
          await api("unbind", {method:"POST",body:{id_token:idToken},google:true});
          setLinked(false);
          result.hidden = true;
        } catch (e) { error.textContent = "解除綁定需先以 Life 帳號登入。" + e.message; }
      });
      async function show(view) {
        if (!linked) return;
        error.textContent = "";
        result.hidden = false;
        result.replaceChildren(text("p","正在載入…"));
        try {
          const data = await api(view);
          result.replaceChildren();
          if (view === "drafts") {
            result.append(text("h2", "最近 20 筆 LINE 草稿"));
            result.append(text("p","可複製文字到 Life「快速新增」，由你確認後正式存入。日期以 LINE 訊息傳送日為準。","muted"));
            if (!data.drafts.length) result.append(text("p","目前沒有草稿。"));
            for (const draft of data.drafts) {
              const item = text("div", "", "item");
              item.append(text("div", new Date(draft.received_at).toLocaleString("zh-TW",{timeZone:"Asia/Taipei"}),"muted"));
              item.append(text("div",draft.text));
              const copy = text("button","複製草稿");
              copy.addEventListener("click", async () => {
                try {await navigator.clipboard.writeText(draft.text);copy.textContent="已複製，請回 Life 確認"; }
                catch (_) {error.textContent="無法使用剪貼簿，請手動選取文字。";}
              });
              item.append(copy);
              result.append(item);
            }
            const go = text("a","開啟 Life 快速新增","action");
            go.href="/";
            result.append(go);
          } else if (view === "search") {
            result.append(text("h2","查詢個人留存"));
            result.append(text("p","搜尋本人 Life 筆記、待辦與購物品項。行事曆與活動仍在 Life 網站查看。","muted"));
            const searchForm = document.createElement("form");
            searchForm.style.display = "flex";
            searchForm.style.gap = "8px";
            searchForm.style.flexWrap = "wrap";
            const input = document.createElement("input");
            input.type = "search";
            input.maxLength = 80;
            input.minLength = 2;
            input.required = true;
            input.placeholder = "輸入兩字以上關鍵字";
            input.setAttribute("aria-label","搜尋個人資料");
            input.style.flex = "1";
            input.style.padding = "12px";
            const submit = text("button","搜尋");
            submit.type = "submit";
            searchForm.append(input, submit);
            const found = document.createElement("div");
            result.append(searchForm, found);
            searchForm.addEventListener("submit",async event => {
              event.preventDefault();
              const q = input.value.trim();
              if (q.length < 2) return;
              found.replaceChildren(text("p","查詢中…"));
              try {
                const matches = await api("search?q=" + encodeURIComponent(q));
                found.replaceChildren();
                for (const [key,heading] of [["notes","筆記"],["tasks","待辦"],["shopping_items","購物品項"]]) {
                  found.append(text("h3",heading));
                  for (const item of matches[key] || []) {
                    found.append(text("div", item.title || item.name || "未命名", "item"));
                    if (item.snippet) found.append(text("p",item.snippet,"muted"));
                  }
                  if (!(matches[key] || []).length) found.append(text("p","沒有符合的記錄。","muted"));
                }
              } catch (e) {found.replaceChildren(text("p",e.message));}
            });
          } else {
            result.append(text("h2","Life 個人概覽"));
            result.append(text("h3","未完成待辦（最多 5 項）"));
            for (const t of data.tasks) {
              result.append(text("div",t.title + (t.due_at ? "｜"+new Date(t.due_at).toLocaleString("zh-TW",{timeZone:"Asia/Taipei"}) : ""),"item"));
            }
            if (!data.tasks.length) result.append(text("p","沒有可顯示的待辦。"));
            result.append(text("h3","購物清單（最多 5 個）"));
            for (const l of data.shopping_lists) result.append(text("div",l.name,"item"));
            if (!data.shopping_lists.length) result.append(text("p","沒有可顯示的清單。"));
            result.append(text("p","Google 日曆及活動請回 Life 查詢。","muted"));
          }
        } catch (e) { result.replaceChildren();error.textContent=e.message; }
      }
      for (const btn of document.querySelectorAll("[data-view]"))
        btn.addEventListener("click", () => show(btn.dataset.view));
      init();
    })();
  </script>
</body>
</html>
