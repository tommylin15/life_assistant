<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>連結 LINE 與 Life</title><link rel="stylesheet" href="style.css"><script src="link.js" defer></script></head><body><header><small>LIFE ASSISTANT</small><h1>連結你的 LINE</h1><p>請在 Safari／Chrome 等外部瀏覽器開啟此頁，使用原有 Google 帳號登入 Life。</p></header><p id="status" role="status"></p><main><section><p id="identity"></p><a class="button" href="/auth/login" id="login">登入 Life</a><p class="muted">登入後請重新開啟本頁；請勿分享綁定碼或替其他人綁定。</p><div class="actions"><button id="start">產生綁定碼</button><button id="unlink">解除既有綁定</button></div></section><section id="challenge" hidden><h2>1. 傳送到自己的官方帳號聊天</h2><p>複製以下整行，傳到你的 Life LINE 官方帳號。綁定碼十分鐘後到期。</p><code id="code"></code><div class="actions"><button id="copy">複製</button></div><h2>2. 核對後完成綁定</h2><button id="check">檢查是否收到</button><p id="suffix"></p><button id="confirm" disabled>尾碼與我的 LINE 回覆一致，確認綁定</button></section><a href="/">返回 Life</a></main></body></html>
